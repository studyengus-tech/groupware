<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>결재온 그룹웨어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onerror="this.remove()">
<style>
:root{
  --paper:#F3F4F6; --card:#FFFFFF; --ink:#1E2430; --sub:#6C7482; --line:#E2E5EA;
  --navy:#2C4A66; --navy-d:#20374C; --navy-t:#EAF0F5;
  --stamp:#C13B2E; --stamp-t:#FBEEEC;
  --ok:#2F7D5C; --ok-t:#E9F3EE; --warn:#B67A1F; --warn-t:#F9F1E2;
  --r:12px; --shadow:0 1px 3px rgba(30,36,48,.08);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; font-size:inherit; color:inherit}
input,select,textarea{
  font-family:inherit; font-size:15px; color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:100%; background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy); outline-offset:-1px; border-color:var(--navy)}
label{display:block; font-size:13px; font-weight:600; color:var(--sub); margin:14px 0 5px}
h2{font-size:19px; font-weight:700}
h3{font-size:16px; font-weight:700}
.hidden{display:none!important}

/* ── 인장(도장) 로고 ── */
.seal{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border:2px solid var(--stamp); border-radius:8px;
  color:var(--stamp); font-weight:800; font-size:17px; background:#fff;
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(193,59,46,.35);
  transform:rotate(-4deg); flex:none;
}

/* ── 로그인 ── */
#loginView{
  min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--navy-d) 0%,var(--navy) 60%,#3A5F80 100%); padding:24px;
}
.login-card{background:#fff; border-radius:16px; padding:34px 28px; width:100%; max-width:380px; box-shadow:0 12px 40px rgba(0,0,0,.25)}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:6px}
.login-brand .seal{width:44px; height:44px; font-size:22px}
.login-brand h1{font-size:24px; font-weight:800; letter-spacing:-.5px}
.login-sub{color:var(--sub); font-size:13px; margin-bottom:10px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--navy); color:#fff; font-weight:700; border-radius:9px;
  padding:12px 18px; width:100%; margin-top:18px; transition:background .15s;
}
.btn:hover{background:var(--navy-d)}
.btn.small{width:auto; padding:8px 14px; font-size:13px; margin-top:0}
.btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line)}
.btn.ghost:hover{background:var(--navy-t)}
.btn.danger{background:var(--stamp)}
.btn.danger:hover{background:#A32F24}
.btn:disabled{opacity:.5; cursor:not-allowed}
.login-hint{margin-top:16px; padding:11px 13px; background:var(--paper); border-radius:8px; font-size:12.5px; color:var(--sub)}
.login-err{color:var(--stamp); font-size:13px; margin-top:12px; font-weight:600}

/* ── 앱 레이아웃 ── */
#appView{display:flex; min-height:100dvh}
.sidebar{
  width:228px; flex:none; background:var(--navy-d); color:#fff; padding:20px 14px;
  display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100dvh;
}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px; font-size:18px; font-weight:800}
.sidebar .brand .seal{background:var(--navy-d); border-color:#E8A79F; color:#F3C2BB; box-shadow:none; width:30px; height:30px; font-size:15px}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px;
  color:#C6D2DD; font-weight:600; font-size:14.5px; text-align:left; width:100%;
}
.nav-item .ico{font-size:17px; width:22px; text-align:center}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff}
.nav-item.active{background:rgba(255,255,255,.14); color:#fff}
.nav-badge{margin-left:auto; background:var(--stamp); color:#fff; font-size:11px; font-weight:700; border-radius:99px; padding:1px 7px}
.sidebar .spacer{flex:1}
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  background:#fff; border-bottom:1px solid var(--line); padding:12px 20px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20;
}
.topbar .title{font-size:17px; font-weight:800; flex:1}
.user-chip{display:flex; align-items:center; gap:9px; font-size:13.5px}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--navy-t); color:var(--navy);
  display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none;
}
.content{padding:18px 20px 90px; max-width:920px; width:100%; margin:0 auto}

/* 모바일 하단 탭 */
.tabbar{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:#fff; border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar .tabs{display:flex}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:10.5px; font-weight:600; color:var(--sub); padding:5px 0; position:relative;
}
.tab .ico{font-size:20px}
.tab.active{color:var(--navy)}
.tab .dot{position:absolute; top:2px; right:calc(50% - 16px); width:8px; height:8px; border-radius:50%; background:var(--stamp)}
@media(max-width:820px){
  .sidebar{display:none}
  .tabbar{display:block}
  .content{padding:14px 14px 96px}
}

/* ── 카드/리스트 공통 ── */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
.card .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px}
.card .card-head .more{font-size:13px; color:var(--sub); font-weight:600}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px}
.stat{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow)}
.stat .k{font-size:12.5px; color:var(--sub); font-weight:600}
.stat .v{font-size:22px; font-weight:800; margin-top:2px}
.stat .v small{font-size:13px; font-weight:600; color:var(--sub)}
.list-row{
  display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);
  width:100%; text-align:left;
}
.list-row:last-child{border-bottom:none}
.list-row .grow{flex:1; min-width:0}
.list-row .t{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.list-row .s{font-size:12.5px; color:var(--sub); margin-top:1px}
.pill{font-size:11.5px; font-weight:700; border-radius:99px; padding:3px 10px; flex:none}
.pill.wait{background:var(--warn-t); color:var(--warn)}
.pill.ok{background:var(--ok-t); color:var(--ok)}
.pill.no{background:var(--stamp-t); color:var(--stamp)}
.pill.ing{background:var(--navy-t); color:var(--navy)}
.empty{padding:34px 10px; text-align:center; color:var(--sub); font-size:13.5px}
.seg{display:flex; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:14px; overflow-x:auto}
.seg button{flex:1; padding:8px 12px; border-radius:8px; font-size:13.5px; font-weight:700; color:var(--sub); white-space:nowrap}
.seg button.active{background:var(--navy); color:#fff}
.toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
table.grid{width:100%; border-collapse:collapse; font-size:13.5px}
table.grid th{background:var(--paper); font-weight:700; color:var(--sub); font-size:12.5px}
table.grid th,table.grid td{border:1px solid var(--line); padding:8px 9px; text-align:center}
table.grid td.l{text-align:left}
table.grid td.r{text-align:right}
.table-wrap{overflow-x:auto}

/* ── 결재 문서 상세 + 도장 ── */
.doc-sheet{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:22px 20px; box-shadow:var(--shadow)}
.doc-sheet .doc-title{font-size:19px; font-weight:800; padding-bottom:12px; border-bottom:2px solid var(--ink)}
.doc-meta{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13.5px; margin:12px 0; color:var(--sub)}
.doc-meta b{color:var(--ink)}
.doc-body{white-space:pre-wrap; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); min-height:80px}
.appr-line{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
.appr-box{
  border:1.5px solid var(--line); border-radius:10px; width:96px; text-align:center; overflow:hidden; background:#fff;
}
.appr-box .role{background:var(--paper); font-size:11px; font-weight:700; color:var(--sub); padding:4px}
.appr-box .sign{height:64px; display:flex; align-items:center; justify-content:center; position:relative}
.appr-box .nm{font-size:12px; padding:4px; border-top:1px solid var(--line); font-weight:600}
.stamp-mark{
  width:52px; height:52px; border-radius:50%; border:2.5px solid var(--stamp); color:var(--stamp);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3.5px rgba(193,59,46,.45);
  transform:rotate(-8deg); letter-spacing:1px;
  animation:stampIn .25s cubic-bezier(.2,1.6,.4,1);
}
.stamp-mark.reject{border-color:#555; color:#555; box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3.5px rgba(85,85,85,.4)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.6); opacity:0}to{transform:rotate(-8deg) scale(1); opacity:1}}
@media(prefers-reduced-motion:reduce){.stamp-mark{animation:none}}
.appr-wait{color:#C9CED6; font-size:12px; font-weight:700}
.comment-log{margin-top:14px; font-size:13px}
.comment-log .c{padding:8px 10px; background:var(--paper); border-radius:8px; margin-top:6px}

/* ── 근태 시계 ── */
.clock-card{text-align:center; padding:26px 18px}
.clock-time{font-size:38px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums}
.clock-date{color:var(--sub); font-size:13.5px; margin-bottom:14px}
.clock-btns{display:flex; gap:10px; justify-content:center}
.clock-btns .btn{width:auto; min-width:120px; margin-top:0}
.clock-state{margin-top:12px; font-size:13.5px; color:var(--sub)}

/* ── 급여 명세 ── */
.pay-net{font-size:26px; font-weight:800; color:var(--navy)}
.pay-table{width:100%; font-size:13.5px; border-collapse:collapse; margin-top:10px}
.pay-table td{padding:7px 2px; border-bottom:1px dashed var(--line)}
.pay-table td:last-child{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.pay-table tr.sum td{border-bottom:none; font-weight:800; padding-top:10px}
.pay-table tr.deduct td:last-child{color:var(--stamp)}

/* 모달 */
.modal-bg{position:fixed; inset:0; background:rgba(20,26,36,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:520px; max-height:88dvh; overflow-y:auto; padding:22px 20px 26px}
@media(min-width:600px){.modal{border-radius:16px}}
.modal h3{margin-bottom:4px}
.toast{
  position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:99;
  background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
  padding:10px 18px; border-radius:99px; box-shadow:0 6px 20px rgba(0,0,0,.25);
  opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1}
.appr-picked{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.appr-picked .chip{background:var(--navy-t); color:var(--navy); font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:99px; display:inline-flex; gap:6px; align-items:center}
.appr-picked .chip button{color:var(--navy); font-weight:800}
</style>
</head>
<body>

<!-- ══════════ 로그인 ══════════ -->
<div id="loginView">
  <div class="login-card">
    <div class="login-brand"><span class="seal">決</span><h1>결재온</h1></div>
    <div class="login-sub">사내 그룹웨어 · 전자결재 / 게시판 / 근태 / 급여</div>
    <label for="loginId">사번</label>
    <input id="loginId" inputmode="numeric" autocomplete="username" placeholder="예: 1001">

    <div class="login-hint">
      데모 계정 — 관리자: <b>1001 / admin1234</b> · 사원: <b>1002 / 1234</b><br>

</div>

<!-- ══════════ 앱 ══════════ -->
<div id="appView" class="hidden">
  <nav class="sidebar" id="sideNav">
    <div class="brand"><span class="seal">決</span>결재온</div>
    <button class="nav-item" data-view="home"><span class="ico">🏠</span>홈</button>

    <div class="spacer"></div>
    <button class="nav-item" id="btnLogout"><span class="ico">🚪</span>로그아웃</button>
  </nav>

  <div class="main">
    <header class="topbar">
      <span class="seal" style="width:28px;height:28px;font-size:14px" aria-hidden="true">決</span>
      <span class="title" id="topTitle">홈</span>
      <span class="user-chip"><span class="avatar" id="topAvatar">?</span><span id="topName"></span></span>
      <button class="btn small ghost" id="btnLogout2">로그아웃</button>

    <div class="content">
      <!-- 홈 -->
      <section id="view-home"></section>
      <!-- 전자결재 -->
      <section id="view-approval" class="hidden"></section>
      <!-- 게시판 -->

      <!-- 근태 -->

      <!-- 급여 -->

      <!-- 관리자 -->

  <nav class="tabbar"><div class="tabs">
    <button class="tab" data-view="home"><span class="ico">🏠</span>홈</button>
    <button class="tab" data-view="approval"><span class="ico">🖋️</span>결재<span class="dot hidden" id="tabDotAppr"></span></button>
    <button class="tab" data-view="board"><span class="ico">📋</span>게시판</button>
    <button class="tab" data-view="attend"><span class="ico">⏰</span>근태</button>

</div>

<div id="modalRoot"></div>

<!-- ══════════ 핵심 로직 (DOM 무관 · 단위테스트 대상) ══════════ -->
<script id="coreLogic">
"use strict";
const CORE = (() => {

  const fmtMoney = n => (n ?? 0).toLocaleString("ko-KR");
  const pad2 = n => String(n).padStart(2, "0");
  const dateStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const monthStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  const timeStr = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  const floor10 = n => Math.floor(Math.round(n) / 10) * 10;

  /* ── 급여: 4대보험 + 간이 소득세(근사) + 소액부징수 ──
     요율(2025~26 기준 근사): 국민연금 4.5%(기준소득월액 상한 637만),
     건강보험 3.545%, 장기요양 = 건강보험료의 12.95%, 고용보험 0.9% */
  function estimateIncomeTax(taxableMonthly, dependents = 1) {
    // 간이세액표 근사식(프로토타입): 연환산 과세표준 누진 적용 후 월할
    if (taxableMonthly < 1_060_000) return 0;      // 간이세액표 과세 하한
    const annual = taxableMonthly * 12;
    const laborDeduct =
      annual <= 5_000_000 ? annual * 0.7 :
      annual <= 15_000_000 ? 3_500_000 + (annual - 5_000_000) * 0.4 :
      annual <= 45_000_000 ? 7_500_000 + (annual - 15_000_000) * 0.15 :
      annual <= 100_000_000 ? 12_000_000 + (annual - 45_000_000) * 0.05 :
      14_750_000 + (annual - 100_000_000) * 0.02;
    const personal = 1_500_000 * Math.max(1, dependents);
    const base = Math.max(0, annual - laborDeduct - personal);
    let tax =
      base <= 14_000_000 ? base * 0.06 :
      base <= 50_000_000 ? 840_000 + (base - 14_000_000) * 0.15 :
      base <= 88_000_000 ? 6_240_000 + (base - 50_000_000) * 0.24 :
      base <= 150_000_000 ? 15_360_000 + (base - 88_000_000) * 0.35 :
      37_060_000 + (base - 150_000_000) * 0.38;
    // 근로소득세액공제(간이 근사): 산출세액 55%/30%, 한도 74만
    const credit = Math.min(740_000, tax <= 1_300_000 ? tax * 0.55 : 715_000 + (tax - 1_300_000) * 0.30);
    tax = Math.max(0, tax - credit);
    return floor10(tax / 12);
  }

  const DEFAULT_RATES = { pension: 0.045, health: 0.03545, careOfHealth: 0.1295, employ: 0.009, npCap: 6_370_000 };
  function calcPayroll({ base = 0, allowance = 0, overtime = 0, mealTaxFree = 200_000, dependents = 1, rates = DEFAULT_RATES }) {
    const R = { ...DEFAULT_RATES, ...rates };
    const gross = base + allowance + overtime;
    const taxable = Math.max(0, gross - Math.min(mealTaxFree, gross));
    const npBase = Math.min(taxable, R.npCap);
    const pension = floor10(npBase * R.pension);
    const health  = floor10(taxable * R.health);
    const care    = floor10(health * R.careOfHealth);
    const employ  = floor10(taxable * R.employ);
    let incomeTax = estimateIncomeTax(taxable, dependents);
    if (incomeTax < 1000) incomeTax = 0;            // 소액부징수
    const localTax = floor10(incomeTax * 0.1);
    const totalDeduct = pension + health + care + employ + incomeTax + localTax;
    return { gross, taxable, pension, health, care, employ, incomeTax, localTax, totalDeduct, net: gross - totalDeduct };
  }

  /* ── 일용직 급여: 일당 기준, 고용보험만 적용
     일용근로소득세 = (일당 - 비과세한도) × 6% × 45%(=2.7%), 일별 소액부징수(1,000원 미만 0) ── */
  function calcDailyPayroll({ dailyWage = 0, days = 0, otMin = 0, otMult = 1.5,
                              taxFreeDaily = 150_000, employRate = 0.009 }) {
    const otPay = floor10(dailyWage / 8 * otMult * (otMin / 60));
    const gross = dailyWage * days + otPay;
    const employ = floor10(gross * employRate);
    let perDayTax = Math.floor(Math.max(0, dailyWage - taxFreeDaily) * 0.06 * 0.45);
    if (perDayTax < 1000) perDayTax = 0;             // 일별 소액부징수
    const incomeTax = perDayTax * days;
    const localTax = floor10(perDayTax * 0.1) * days;
    const totalDeduct = employ + incomeTax + localTax;
    return { gross, otPay, pension: 0, health: 0, care: 0, employ, incomeTax, localTax, totalDeduct, net: gross - totalDeduct };
  }

  /* ── 근태 판정: 09:00 출근 / 18:00 퇴근 기준 ── */
  function toMin(hm) { if (!hm) return null; const [h, m] = hm.split(":").map(Number); return h * 60 + m; }
  const DEFAULT_WORK = { startMin: 9 * 60, endMin: 18 * 60, breakMin: 60 };
  function judgeAttendance(inTime, outTime, pol = DEFAULT_WORK) {
    const i = toMin(inTime), o = toMin(outTime);
    if (i == null) return { status: "결근", workMin: 0 };
    let status = i > pol.startMin ? "지각" : "정상";
    let workMin = 0;
    if (o != null) {
      workMin = Math.max(0, o - i - pol.breakMin);   // 휴게 공제
      if (o < pol.endMin && status === "정상") status = "조퇴";
      else if (o < pol.endMin && status === "지각") status = "지각·조퇴";
    } else {
      status += " (근무중)";
    }
    return { status, workMin };
  }
  const minToHM = m => `${Math.floor(m / 60)}시간 ${m % 60}분`;

  /* ── 전자결재 상태 전이 ──
     doc.line = [{userId,name,position,status:'대기'|'승인'|'반려',date,comment}] */
  function approveStep(doc, userId, action, comment = "") {
    if (doc.status !== "진행") return { ok: false, msg: "이미 종결된 문서입니다." };
    const idx = doc.line.findIndex(s => s.status === "대기");
    if (idx === -1) return { ok: false, msg: "결재할 단계가 없습니다." };
    if (doc.line[idx].userId !== userId) return { ok: false, msg: "현재 결재 순서가 아닙니다." };
    const step = doc.line[idx];
    step.date = new Date().toISOString();
    step.comment = comment;
    if (action === "approve") {
      step.status = "승인";
      if (idx === doc.line.length - 1) { doc.status = "완료"; doc.completedAt = step.date; }
      else doc.currentStep = idx + 1;
    } else if (action === "reject") {
      step.status = "반려";
      doc.status = "반려";
      doc.completedAt = step.date;
    } else return { ok: false, msg: "알 수 없는 동작입니다." };
    return { ok: true, doc };
  }

  function myTurn(doc, userId) {
    if (doc.status !== "진행") return false;
    const idx = doc.line.findIndex(s => s.status === "대기");
    return idx !== -1 && doc.line[idx].userId === userId;
  }

  return { fmtMoney, pad2, dateStr, monthStr, timeStr, calcPayroll, calcDailyPayroll, estimateIncomeTax,
           judgeAttendance, minToHM, approveStep, myTurn, toMin, DEFAULT_WORK, DEFAULT_RATES };
})();
globalThis.CORE = CORE;
if (typeof module !== "undefined") module.exports = CORE;
</script>

<script id="dbLayer">
"use strict";
const DB = (() => {
  const NAME = "groupwareDB", VER = 3;
  const STORES = ["users", "docs", "posts", "payroll", "attendance", "auditlog", "settings"];
  let db = null;

  function open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("users"))      d.createObjectStore("users", { keyPath: "id" });
        if (!d.objectStoreNames.contains("docs"))       d.createObjectStore("docs", { keyPath: "docId", autoIncrement: true });
        if (!d.objectStoreNames.contains("posts"))      d.createObjectStore("posts", { keyPath: "postId", autoIncrement: true });
        if (!d.objectStoreNames.contains("payroll"))    d.createObjectStore("payroll", { keyPath: "payId", autoIncrement: true });
        if (!d.objectStoreNames.contains("attendance")) d.createObjectStore("attendance", { keyPath: "attId", autoIncrement: true });
        if (!d.objectStoreNames.contains("auditlog"))   d.createObjectStore("auditlog", { keyPath: "logId", autoIncrement: true });
        if (!d.objectStoreNames.contains("settings"))   d.createObjectStore("settings", { keyPath: "key" });
      };
      rq.onsuccess = e => { db = e.target.result; res(db); };
      rq.onerror = e => rej(e.target.error);
    });
  }
  const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
  const wrap = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });

  return {
    open,
    get:    (s, k) => wrap(tx(s, "readonly").get(k)),
    all:    s      => wrap(tx(s, "readonly").getAll()),
    put:    (s, v) => wrap(tx(s, "readwrite").put(v)),
    add:    (s, v) => wrap(tx(s, "readwrite").add(v)),
    del:    (s, k) => wrap(tx(s, "readwrite").delete(k)),
    count:  s      => wrap(tx(s, "readonly").count()),
  };
})();
globalThis.DB = DB;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

  for (const r of rows) if (r.key in CFG) CFG[r.key] = typeof CFG_DEFAULTS[r.key] === "object" && !Array.isArray(CFG_DEFAULTS[r.key]) ? { ...CFG_DEFAULTS[r.key], ...r.value } : r.value;

const payRates = () => ({ pension: CFG.pay.pensionPct / 100, health: CFG.pay.healthPct / 100, careOfHealth: CFG.pay.carePct / 100, employ: CFG.pay.employPct / 100, npCap: Number(CFG.pay.npCap) });

<!-- ══════════ 서비스 계층 (업무 로직 · UI/시뮬레이션 공용) ══════════ -->
<script id="svcLayer">
"use strict";
const SVC = (() => {
  const stdDayMin = () => Math.max(1, CORE.toMin(CFG.work.end) - CORE.toMin(CFG.work.start) - (Number(CFG.work.breakMin) || 60));
  const floor10 = n => Math.floor(Math.round(n) / 10) * 10;

  async function log(actor, action, detail = "") {
    try {
      await DB.add("auditlog", { ts: new Date().toISOString(), userId: actor?.id ?? "-", userName: actor?.name ?? "-", action, detail: String(detail).slice(0, 200) });
    } catch (e) { /* 로그 실패가 업무를 막지 않음 */ }
  }

  /* ── 근태 ── */
  async function clockIn(user, now = new Date()) {
    const date = CORE.dateStr(now);
    const dup = (await DB.all("attendance")).find(a => a.userId === user.id && a.date === date);
    if (dup) return { ok: false, msg: "이미 출근 처리되었습니다." };
    const inTime = CORE.timeStr(now);
    const j = CORE.judgeAttendance(inTime, null, workPol());
    await DB.add("attendance", { userId: user.id, userName: user.name, date, inTime, outTime: null, workMin: 0, status: j.status });
    await log(user, "출근", `${date} ${inTime}`);
    return { ok: true, inTime };
  }
  async function clockOut(user, now = new Date()) {
    const date = CORE.dateStr(now);
    const a = (await DB.all("attendance")).find(x => x.userId === user.id && x.date === date);
    if (!a) return { ok: false, msg: "출근 기록이 없습니다." };
    if (a.outTime) return { ok: false, msg: "이미 퇴근 처리되었습니다." };
    a.outTime = CORE.timeStr(now);
    const j = CORE.judgeAttendance(a.inTime, a.outTime, workPol());
    a.workMin = j.workMin; a.status = j.status;
    await DB.put("attendance", a);
    await log(user, "퇴근", `${date} ${a.outTime} (${a.status})`);
    return { ok: true, outTime: a.outTime, status: a.status };
  }

  /* ── 전자결재 ── */
  async function submitDoc({ drafter, type, title, body = "", meta = {}, lineUsers = [] }) {
    if (!title) return { ok: false, msg: "제목이 없습니다." };
    if (!lineUsers.length) return { ok: false, msg: "결재선이 없습니다." };
    const docId = await DB.add("docs", {
      type, title, body, meta,
      drafterId: drafter.id, drafterName: drafter.name, drafterDept: drafter.dept, drafterPos: drafter.position,
      line: lineUsers.map(u => ({ userId: u.id, name: u.name, position: u.position, status: "대기", date: null, comment: "" })),
      currentStep: 0, status: "진행", createdAt: new Date().toISOString(),
    });
    // 문서번호 자동 채번: 부서명-번호 (아마란스 방식)
    const nd = await DB.get("docs", docId);
    nd.docNo = `${(drafter.dept || "일반").replace(/\s/g, "")}-${1000 + Number(docId)}`;
    await DB.put("docs", nd);
    await log(drafter, "문서상신", `${nd.docNo} [${type}] ${title}`);
    return { ok: true, docId, docNo: nd.docNo };
  }

  /* ── 상신 회수: 아무도 결재하지 않은 진행 문서만 기안자가 회수 가능 ── */
  async function recallDoc(docId, actor) {
    const d = await DB.get("docs", docId);
    if (!d) return { ok: false, msg: "문서를 찾을 수 없습니다." };
    if (d.drafterId !== actor.id) return { ok: false, msg: "기안자만 회수할 수 있습니다." };
    if (d.status !== "진행") return { ok: false, msg: "진행중 문서만 회수할 수 있습니다." };
    if (d.line.some(x => x.status !== "대기")) return { ok: false, msg: "이미 결재가 시작되어 회수할 수 없습니다." };
    d.status = "회수"; d.completedAt = new Date().toISOString();
    await DB.put("docs", d);
    await log(actor, "문서회수", `${d.docNo || "#" + docId} ${d.title}`);
    return { ok: true };
  }

  /* ── 연차 현황: 부여 - 승인된 연차 사용일 = 잔여 ── */
  async function leaveStatus(userId) {
    const u = await DB.get("users", userId);
    const granted = (u && u.empType !== "daily") ? (u.annualLeave ?? 15) : 0;
    const docs = (await DB.all("docs")).filter(d =>
      d.drafterId === userId && d.type === "휴가신청" && d.status === "완료" && d.meta && d.meta.kind === "연차" && d.meta.from);
    let used = 0;
    for (const d of docs) {
      const from = new Date(d.meta.from), to = new Date(d.meta.to || d.meta.from);
      used += Math.max(1, Math.round((to - from) / 86400000) + 1);
    }
    return { granted, used, remain: granted - used, rate: granted ? Math.round(used / granted * 100) : 0 };
  }
  async function actOnDoc(docId, actor, action, comment = "") {
    const d = await DB.get("docs", docId);
    if (!d) return { ok: false, msg: "문서를 찾을 수 없습니다." };
    const r = CORE.approveStep(d, actor.id, action, comment);
    if (!r.ok) return r;
    await DB.put("docs", d);
    await log(actor, action === "approve" ? "결재승인" : "결재반려", `#${docId} ${d.title} → ${d.status}`);
    return { ok: true, status: d.status };
  }

  /* ── 근태 → 급여 자동 계산 ── */
  async function monthAttendance(userId, ym) {
    const rows = (await DB.all("attendance")).filter(a => a.userId === userId && a.date.startsWith(ym) && a.outTime);
    const std = stdDayMin();
    const otMin = rows.reduce((t, a) => t + Math.max(0, (a.workMin || 0) - std), 0);
    const lateN = rows.filter(a => a.status.startsWith("지각")).length;
    const totalMin = rows.reduce((t, a) => t + (a.workMin || 0), 0);
    return { workDays: rows.length, otMin, lateN, totalMin };
  }
  const overtimePay = (salaryBase, otMin) => floor10(salaryBase / Number(CFG.pay.monthHours) * Number(CFG.pay.otMult) * (otMin / 60));

  async function runMonthlyPayroll(ym, { allowance = 200000, actor = null } = {}) {
    const users = await DB.all("users");
    const existing = await DB.all("payroll");
    const results = [];
    for (const u of users) {
      if (existing.find(p => p.userId === u.id && p.ym === ym && (p.kind || "salary") === "salary")) {
        results.push({ userId: u.id, name: u.name, skipped: true }); continue;
      }
      const att = await monthAttendance(u.id, ym);
      let rec;
      if ((u.empType || "regular") === "daily") {
        const calc = CORE.calcDailyPayroll({ dailyWage: u.dailyWage || 0, days: att.workDays, otMin: att.otMin,
          otMult: Number(CFG.pay.otMult), taxFreeDaily: Number(CFG.daily.taxFree), employRate: CFG.daily.employPct / 100 });
        rec = { kind: "salary", empType: "daily", userId: u.id, userName: u.name, ym,
          base: (u.dailyWage || 0) * att.workDays, dailyWage: u.dailyWage || 0, allowance: 0, overtime: calc.otPay,
          otMin: att.otMin, lateN: att.lateN, workDays: att.workDays,
          gross: calc.gross, pension: 0, health: 0, care: 0, employ: calc.employ,
          incomeTax: calc.incomeTax, localTax: calc.localTax, totalDeduct: calc.totalDeduct, net: calc.net };
      } else {
        const overtime = overtimePay(u.salaryBase, att.otMin);
        const calc = CORE.calcPayroll({ base: u.salaryBase, allowance, overtime, mealTaxFree: Number(CFG.pay.mealTaxFree), rates: payRates() });
        rec = { kind: "salary", empType: "regular", userId: u.id, userName: u.name, ym,
          base: u.salaryBase, allowance, overtime, otMin: att.otMin, lateN: att.lateN, workDays: att.workDays, ...calc };
      }
      await DB.add("payroll", { ...rec, issued: true, issuedAt: new Date().toISOString(), createdAt: new Date().toISOString() });
      results.push({ userId: u.id, name: u.name, empType: rec.empType, otMin: att.otMin, overtime: rec.overtime, net: rec.net });
    }
    await log(actor, "급여일괄계산", `${ym} · ${results.filter(r => !r.skipped).length}건 발급`);
    return results;
  }
  async function grantBonus(ym, entries, { label = "성과급", actor = null } = {}) {
    const existing = await DB.all("payroll");
    const results = [];
    for (const { userId, amount } of entries) {
      const u = await DB.get("users", userId);
      if (!u || !(amount > 0)) continue;
      if (existing.find(p => p.userId === userId && p.ym === ym && p.kind === "bonus")) {
        results.push({ userId, skipped: true }); continue;
      }
      const calc = CORE.calcPayroll({ base: amount, allowance: 0, overtime: 0, mealTaxFree: 0 });
      await DB.add("payroll", {
        kind: "bonus", label, userId, userName: u.name, ym, base: amount, allowance: 0, overtime: 0,
        ...calc, issued: true, issuedAt: new Date().toISOString(), createdAt: new Date().toISOString(),
      });
      results.push({ userId, name: u.name, net: calc.net });
    }
    await log(actor, "성과급지급", `${ym} · ${results.filter(r => !r.skipped).length}건`);
    return results;
  }

  /* ── 감사 리포트 ── */
  async function buildAudit(ymFrom, ymTo) {
    const inRange = ym => ym >= ymFrom && ym <= ymTo;
    const docs = (await DB.all("docs")).filter(d => inRange(d.createdAt.slice(0, 7)));
    const atts = (await DB.all("attendance")).filter(a => inRange(a.date.slice(0, 7)));
    const pays = (await DB.all("payroll")).filter(p => inRange(p.ym));
    const violations = [];

    const done = docs.filter(d => d.status === "완료");
    const avgDays = done.length ? done.reduce((t, d) => t + Math.max(0, (new Date(d.completedAt) - new Date(d.createdAt)) / 86400000), 0) / done.length : 0;
    for (const d of docs) {
      if (d.status === "완료" && !d.line.every(x => x.status === "승인")) violations.push(`문서#${d.docId} 완료 상태이나 미승인 단계 존재`);
      if (d.status === "반려" && !d.line.some(x => x.status === "반려")) violations.push(`문서#${d.docId} 반려 상태이나 반려 단계 없음`);
      if (d.status === "진행" && !d.line.some(x => x.status === "대기")) violations.push(`문서#${d.docId} 진행 상태이나 대기 단계 없음`);
    }
    const seen = new Set();
    for (const p of pays) {
      if (p.net !== p.gross - p.totalDeduct) violations.push(`급여#${p.payId} 실수령 산식 불일치`);
      const key = `${p.userId}|${p.ym}|${p.kind || "salary"}`;
      if (seen.has(key)) violations.push(`급여 중복 등록: ${key}`);
      seen.add(key);
    }
    const lateN = atts.filter(a => a.status.startsWith("지각")).length;
    const pendingDocs = docs.filter(d => d.status === "진행");
    const stalePending = pendingDocs.filter(d => (new Date() - new Date(d.createdAt)) / 86400000 > 3).length;
    return {
      period: `${ymFrom} ~ ${ymTo}`,
      docs: { total: docs.length, done: done.length, rejected: docs.filter(d => d.status === "반려").length,
              recalled: docs.filter(d => d.status === "회수").length,
              pending: pendingDocs.length, stalePending,
              avgApprovalDays: Math.round(avgDays * 10) / 10 },
      attendance: { records: atts.length, lateN,
                    lateRate: atts.length ? Math.round(lateN / atts.length * 1000) / 10 : 0,
                    totalHours: Math.round(atts.reduce((t, a) => t + (a.workMin || 0), 0) / 60) },
      payroll: { count: pays.length,
                 gross: pays.reduce((t, p) => t + p.gross, 0),
                 deduct: pays.reduce((t, p) => t + p.totalDeduct, 0),
                 net: pays.reduce((t, p) => t + p.net, 0),
                 bonusCount: pays.filter(p => p.kind === "bonus").length,
                 issued: pays.filter(p => p.issued).length },
      violations,
    };
  }

  /* ── 관리자: 근태 수정/추가/삭제 ── */
  async function upsertAttendance({ attId = null, userId, date, inTime, outTime }, actor) {
    const u = await DB.get("users", userId);
    if (!u || !date || !inTime) return { ok: false, msg: "사원·날짜·출근시각은 필수입니다." };
    const all = await DB.all("attendance");
    const dup = all.find(a => a.userId === userId && a.date === date && a.attId !== attId);
    if (dup) return { ok: false, msg: "해당 일자 기록이 이미 있습니다." };
    const j = CORE.judgeAttendance(inTime, outTime || null, workPol());
    const rec = { userId, userName: u.name, date, inTime, outTime: outTime || null, workMin: j.workMin, status: j.status };
    if (attId != null) { rec.attId = attId; await DB.put("attendance", rec); }
    else await DB.add("attendance", rec);
    await log(actor, attId != null ? "근태수정" : "근태추가", `${u.name} ${date} ${inTime}~${outTime || "-"}`);
    return { ok: true, status: j.status };
  }
  async function deleteAttendance(attId, actor) {
    const a = await DB.get("attendance", attId);
    await DB.del("attendance", attId);
    await log(actor, "근태삭제", a ? `${a.userName} ${a.date}` : `#${attId}`);
    return { ok: true };
  }

  /* ── 관리자: 결재문서 수정/삭제 ── */
  async function editDoc(docId, { title, body }, actor) {
    const d = await DB.get("docs", docId);
    if (!d) return { ok: false, msg: "문서를 찾을 수 없습니다." };
    if (title) d.title = title;
    if (body != null) d.body = body;
    d.editedAt = new Date().toISOString(); d.editedBy = actor?.name;
    await DB.put("docs", d);
    await log(actor, "문서수정", `#${docId} ${d.title}`);
    return { ok: true };
  }
  async function deleteDoc(docId, actor) {
    const d = await DB.get("docs", docId);
    await DB.del("docs", docId);
    await log(actor, "문서삭제", d ? `#${docId} [${d.type}] ${d.title}` : `#${docId}`);
    return { ok: true };
  }

  return { clockIn, clockOut, submitDoc, actOnDoc, recallDoc, leaveStatus, monthAttendance, overtimePay,
           runMonthlyPayroll, grantBonus, buildAudit, log, stdDayMin,
           upsertAttendance, deleteAttendance, editDoc, deleteDoc };
})();
globalThis.SVC = SVC;
</script>

<!-- ══════════ 앱 로직 ══════════ -->
<script id="appLogic">
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const F = CORE.fmtMoney;
let ME = null;               // 로그인 사용자
let USERS = [];              // 사용자 캐시

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function openModal(html) {
  $("#modalRoot").innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeModal(); });
}
function closeModal() { $("#modalRoot").innerHTML = ""; }
const fmtDate = iso => { const d = new Date(iso); return `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, "0")} ${CORE.timeStr(d)}`; };
const statusPill = s => s === "완료" || s === "승인" ? `<span class="pill ok">${s}</span>`
  : s === "반려" ? `<span class="pill no">${s}</span>`
  : s === "진행" ? `<span class="pill ing">진행중</span>`
  : s === "회수" ? `<span class="pill" style="background:#EEF0F3;color:#7A828E">회수</span>`
  : `<span class="pill wait">${esc(s)}</span>`;

/* ── 인증 ── */
async function doLogin() {
  const id = $("#loginId").value.trim(), pw = $("#loginPw").value;
  const err = $("#loginErr");
  err.classList.add("hidden");
  if (!id || !pw) { err.textContent = "사번과 비밀번호를 입력하세요."; err.classList.remove("hidden"); return; }
  const u = await DB.get("users", id);
  if (!u || u.pwHash !== await sha256(pw)) {
    err.textContent = "사번 또는 비밀번호가 올바르지 않습니다."; err.classList.remove("hidden"); return;
  }
  ME = u;
  SVC.log(u, "로그인");
  sessionStorage.setItem("gw_uid", u.id);
  await enterApp();
}
async function enterApp() {
  USERS = await DB.all("users");
  $("#loginView").classList.add("hidden");
  $("#appView").classList.remove("hidden");
  $("#topName").textContent = `${ME.name} ${ME.position}`;
  $("#topAvatar").textContent = ME.name[0];
  $("#navAdmin").classList.toggle("hidden", ME.role !== "admin");
  go("home");
}
function doLogout() {
  sessionStorage.removeItem("gw_uid");
  ME = null;
  $("#appView").classList.add("hidden");
  $("#loginView").classList.remove("hidden");
  $("#loginPw").value = "";
}

/* ── 라우팅 ── */
const TITLES = { home: "홈", approval: "전자결재", board: "게시판", attend: "근태관리", pay: "급여", admin: "관리자" };
async function go(view, param) {
  $$(".nav-item[data-view],.tab[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  $$("section[id^=view-]").forEach(s => s.classList.add("hidden"));
  $(`#view-${view}`).classList.remove("hidden");
  $("#topTitle").textContent = TITLES[view] || "";
  window.scrollTo(0, 0);
  if (view === "home") await renderHome();
  if (view === "approval") await renderApproval(param);
  if (view === "board") await renderBoard(param);
  if (view === "attend") await renderAttend();
  if (view === "pay") await renderPay();
  if (view === "admin") await renderAdmin();
  await refreshBadge();
}
async function refreshBadge() {
  const docs = await DB.all("docs");
  const n = docs.filter(d => CORE.myTurn(d, ME.id)).length;
  $("#badgeAppr").textContent = n;
  $("#badgeAppr").classList.toggle("hidden", n === 0);
  $("#tabDotAppr").classList.toggle("hidden", n === 0);
}

/* ── 홈 ── */
async function renderHome() {
  const [docs, posts, atts] = await Promise.all([DB.all("docs"), DB.all("posts"), DB.all("attendance")]);
  const today = CORE.dateStr(new Date());
  const myAtt = atts.find(a => a.userId === ME.id && a.date === today);
  const waitN = docs.filter(d => CORE.myTurn(d, ME.id)).length;
  const myIngN = docs.filter(d => d.drafterId === ME.id && d.status === "진행").length;
  const notices = posts.filter(p => p.board === "notice").sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 3);
  const attState = !myAtt ? "출근 전" : myAtt.outTime ? `퇴근 완료 (${myAtt.inTime}~${myAtt.outTime})` : `근무중 · ${myAtt.inTime} 출근`;

  $("#view-home").innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="k">결재 대기</div><div class="v">${waitN}<small>건</small></div></div>
      <div class="stat"><div class="k">내 상신 진행중</div><div class="v">${myIngN}<small>건</small></div></div>
      <div class="stat"><div class="k">오늘 근태</div><div class="v" style="font-size:15px;padding-top:6px">${esc(attState)}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>빠른 작업</h3></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small" data-go="approval" data-p="write">🖋️ 기안 작성</button>
        <button class="btn small ghost" data-go="attend">⏰ 출퇴근 체크</button>
        <button class="btn small ghost" data-go="approval" data-p="req">🏖️ 휴가/근무 신청</button>
        ${ME.role === "admin" ? `<button class="btn small ghost" data-go="admin">⚙️ 사원·급여 관리</button>` : ""}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📢 공지사항</h3><button class="more" data-go="board">더보기 ›</button></div>
      ${notices.length ? notices.map(p => `
        <button class="list-row" data-post="${p.postId}">
          <div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.authorName)} · ${fmtDate(p.createdAt)}</div></div>
        </button>`).join("") : `<div class="empty">등록된 공지가 없습니다.</div>`}
    </div>`;
  $("#view-home").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.p));
  $("#view-home").querySelectorAll("[data-post]").forEach(b => b.onclick = () => go("board", { open: Number(b.dataset.post) }));
}

/* ── 전자결재 ── */
const DOC_TYPES = ["일반품의", "지출결의", "휴가신청", "근무신청"];
let apprTab = "todo";
async function renderApproval(param) {
  if (param === "write") { renderApprList(); openDocWrite(); return; }
  if (param === "req") { renderApprList(); openDocWrite("휴가신청"); return; }
  if (param && param.open) { renderApprList().then(() => openDocDetail(param.open)); return; }
  await renderApprList();
}
async function renderApprList() {
  const docs = (await DB.all("docs")).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const lists = {
    todo: docs.filter(d => CORE.myTurn(d, ME.id)),
    mine: docs.filter(d => d.drafterId === ME.id),
    done: docs.filter(d => d.line.some(s => s.userId === ME.id && s.status !== "대기")),
    all:  ME.role === "admin" ? docs : null,
  };
  const cur = lists[apprTab] || [];
  $("#view-approval").innerHTML = `
    <div class="toolbar">
      <div class="seg" style="margin:0;flex:1">
        <button data-t="todo" class="${apprTab === "todo" ? "active" : ""}">결재대기 ${lists.todo.length ? `(${lists.todo.length})` : ""}</button>
        <button data-t="mine" class="${apprTab === "mine" ? "active" : ""}">기안함</button>
        <button data-t="done" class="${apprTab === "done" ? "active" : ""}">결재이력</button>
        ${ME.role === "admin" ? `<button data-t="all" class="${apprTab === "all" ? "active" : ""}">전체</button>` : ""}
      </div>
      <button class="btn small" id="btnDocWrite">＋ 기안</button>
    </div>
    <div class="card" style="padding:6px 14px">
      ${cur.length ? cur.map(d => `
        <button class="list-row" data-doc="${d.docId}">
          <div class="grow">
            <div class="t">[${esc(d.type)}] ${esc(d.title)}</div>
            <div class="s">${d.docNo ? esc(d.docNo) + " · " : ""}${esc(d.drafterName)} ${esc(d.drafterPos || "")} · ${fmtDate(d.createdAt)}</div>
          </div>
          ${statusPill(d.status)}
        </button>`).join("") : `<div class="empty">문서가 없습니다.</div>`}
    </div>`;
  $("#view-approval").querySelectorAll(".seg button").forEach(b => b.onclick = () => { apprTab = b.dataset.t; renderApprList(); });
  $("#btnDocWrite").onclick = () => openDocWrite();
  $("#view-approval").querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDocDetail(Number(b.dataset.doc)));
}

async function openDocWrite(presetType) {
  let line = [];
  const others = USERS.filter(u => u.id !== ME.id);
  const savedRow = await DB.get("settings", `lines_${ME.id}`).catch(() => null);
  const savedLines = (savedRow && savedRow.value) || [];
  const leave = await SVC.leaveStatus(ME.id);
  openModal(`
    <h3>기안 작성</h3>
    <label>문서 종류</label>
    <select id="dwType">${DOC_TYPES.map(t => `<option ${t === presetType ? "selected" : ""}>${t}</option>`).join("")}</select>
    <div id="dwLeave" class="hidden" style="font-size:12.5px;color:var(--navy);background:var(--navy-t);border-radius:8px;padding:8px 10px;margin-top:8px">
      내 연차: 부여 ${leave.granted}일 · 사용 ${leave.used}일 · <b>잔여 ${leave.remain}일</b> (사용률 ${leave.rate}%)</div>
    <div id="dwExtra"></div>
    <label>제목</label><input id="dwTitle" placeholder="문서 제목">
    <label>내용</label><textarea id="dwBody" rows="5" placeholder="기안 내용을 입력하세요"></textarea>
    <label>결재선 (순서대로 추가)</label>
    ${savedLines.length ? `<select id="dwSaved" style="margin-bottom:6px"><option value="">💾 저장된 결재선 불러오기…</option>${savedLines.map((l, i) => `<option value="${i}">${esc(l.name)} (${l.userIds.length}단계)</option>`).join("")}</select>` : ""}
    <select id="dwPick"><option value="">결재자 선택…</option>${others.map(u => `<option value="${u.id}">${esc(u.name)} ${esc(u.position)} · ${esc(u.dept)}</option>`).join("")}</select>
    <div class="appr-picked" id="dwLine"></div>
    <button class="btn small ghost" id="dwSaveLine" style="margin-top:8px">현재 결재선 저장</button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn ghost" id="dwCancel">취소</button>
      <button class="btn" id="dwSubmit">상신</button>
    </div>`);
  const extra = () => {
    const t = $("#dwType").value;
    $("#dwLeave").classList.toggle("hidden", t !== "휴가신청");
    $("#dwExtra").innerHTML = (t === "휴가신청" || t === "근무신청") ? `
      <div class="row2">
        <div><label>시작일</label><input type="date" id="dwFrom" value="${CORE.dateStr(new Date())}"></div>
        <div><label>종료일</label><input type="date" id="dwTo" value="${CORE.dateStr(new Date())}"></div>
      </div>
      <label>구분</label>
      <select id="dwKind">${(t === "휴가신청" ? ["연차", "반차", "병가", "경조사"] : ["초과근무", "휴일근무", "재택근무", "외근"]).map(k => `<option>${k}</option>`).join("")}</select>` : "";
  };
  extra();
  $("#dwType").onchange = extra;
  const drawLine = () => {
    $("#dwLine").innerHTML = line.map((u, i) => `<span class="chip">${i + 1}. ${esc(u.name)} ${esc(u.position)}<button data-i="${i}" aria-label="제거">✕</button></span>`).join("") || `<span style="font-size:12.5px;color:var(--sub)">결재자를 1명 이상 선택하세요</span>`;
    $("#dwLine").querySelectorAll("button").forEach(b => b.onclick = () => { line.splice(Number(b.dataset.i), 1); drawLine(); });
  };
  drawLine();
  $("#dwPick").onchange = e => {
    const u = USERS.find(x => x.id === e.target.value);
    if (u && !line.some(l => l.id === u.id)) { line.push(u); drawLine(); }
    e.target.value = "";
  };
  const savedSel = $("#dwSaved");
  if (savedSel) savedSel.onchange = e => {
    const l = savedLines[Number(e.target.value)];
    if (!l) return;
    line = l.userIds.map(id => USERS.find(u => u.id === id)).filter(Boolean);
    drawLine(); e.target.value = "";
    toast(`결재선 "${l.name}" 적용`);
  };
  $("#dwSaveLine").onclick = async () => {
    if (!line.length) return toast("저장할 결재선이 없습니다");
    const name = line.map(u => u.name).join("→");
    const next = savedLines.filter(l => l.name !== name).concat([{ name, userIds: line.map(u => u.id) }]).slice(-5);
    await DB.put("settings", { key: `lines_${ME.id}`, value: next });
    toast(`결재선 "${name}" 저장 (다음 기안부터 표시)`);
  };
  $("#dwCancel").onclick = closeModal;
  $("#dwSubmit").onclick = async () => {
    const type = $("#dwType").value, title = $("#dwTitle").value.trim(), body = $("#dwBody").value.trim();
    if (!title) return toast("제목을 입력하세요");
    if (!line.length) return toast("결재자를 선택하세요");
    const meta = {};
    if ($("#dwFrom")) { meta.from = $("#dwFrom").value; meta.to = $("#dwTo").value; meta.kind = $("#dwKind").value; }
    const r = await SVC.submitDoc({ drafter: ME, type, title, body, meta, lineUsers: line });
    if (!r.ok) return toast(r.msg);
    closeModal(); toast("상신했습니다"); apprTab = "mine"; await renderApprList(); await refreshBadge();
  };
}

async function openDocDetail(docId) {
  const d = await DB.get("docs", docId);
  if (!d) return toast("문서를 찾을 수 없습니다");
  const metaHtml = d.meta && d.meta.from ? `<span>기간</span><b>${esc(d.meta.from)} ~ ${esc(d.meta.to)} (${esc(d.meta.kind)})</b>` : "";
  const canAct = CORE.myTurn(d, ME.id);
  openModal(`
    <div class="doc-sheet" style="border:none;box-shadow:none;padding:4px 0">
      <div class="doc-title">[${esc(d.type)}] ${esc(d.title)}</div>
      <div class="doc-meta">
        ${d.docNo ? `<span>문서번호</span><b>${esc(d.docNo)}</b>` : ""}
        <span>기안자</span><b>${esc(d.drafterName)} ${esc(d.drafterPos || "")} · ${esc(d.drafterDept || "")}</b>
        <span>기안일</span><b>${fmtDate(d.createdAt)}</b>
        ${metaHtml}
        <span>상태</span><b>${statusPill(d.status)}</b>
      </div>
      <div class="doc-body">${esc(d.body) || "(내용 없음)"}</div>
      <div class="appr-line">
        <div class="appr-box"><div class="role">기안</div><div class="sign"><div class="stamp-mark">${esc(d.drafterName.slice(0, 3))}</div></div><div class="nm">${esc(d.drafterName)}</div></div>
        ${d.line.map(s => `
          <div class="appr-box"><div class="role">${esc(s.position)}</div>
            <div class="sign">${s.status === "승인" ? `<div class="stamp-mark">${esc(s.name.slice(0, 3))}</div>`
              : s.status === "반려" ? `<div class="stamp-mark reject">반려</div>`
              : `<span class="appr-wait">대기</span>`}</div>
            <div class="nm">${esc(s.name)}</div></div>`).join("")}
      </div>
      ${d.line.some(s => s.comment) ? `<div class="comment-log"><b>결재 의견</b>${d.line.filter(s => s.comment).map(s => `<div class="c"><b>${esc(s.name)}</b> · ${esc(s.comment)}</div>`).join("")}</div>` : ""}
      ${canAct ? `
        <label>결재 의견 (선택)</label><input id="ddComment" placeholder="의견 입력">
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn danger" id="ddReject">반려</button>
          <button class="btn" id="ddApprove">승인</button>
        </div>` : `
        ${d.drafterId === ME.id && d.status === "진행" && d.line.every(x => x.status === "대기") ? `<button class="btn ghost" id="ddRecall" style="margin-top:14px;color:var(--stamp)">상신 회수</button>` : ""}
        <button class="btn ghost" id="ddClose" style="margin-top:10px">닫기</button>`}
    </div>`);
  if (canAct) {
    $("#ddApprove").onclick = () => actDoc(d, "approve");
    $("#ddReject").onclick = () => actDoc(d, "reject");
  } else {
    $("#ddClose").onclick = closeModal;
    const rc = $("#ddRecall");
    if (rc) rc.onclick = async () => {
      const r = await SVC.recallDoc(d.docId, ME);
      if (!r.ok) return toast(r.msg);
      closeModal(); toast("회수했습니다"); await renderApprList(); await refreshBadge();
    };
  }
}
async function actDoc(d, action) {
  const r = await SVC.actOnDoc(d.docId, ME, action, $("#ddComment").value.trim());
  if (!r.ok) return toast(r.msg);
  closeModal();
  toast(action === "approve" ? "승인 처리했습니다" : "반려 처리했습니다");
  await renderApprList(); await refreshBadge();
}
</script>

<!-- ══════════ 게시판 · 근태 · 급여 · 관리자 ══════════ -->
<script id="appLogic2">
"use strict";
/* ── 게시판 ── */
let boardTab = "notice";
const canWrite = b => b && (b.write === "all" || ME.role === "admin");
async function renderBoard(param) {
  if (!CFG.boards.find(b => b.key === boardTab)) boardTab = CFG.boards[0]?.key;
  const cur = CFG.boards.find(b => b.key === boardTab);
  const posts = (await DB.all("posts")).filter(p => p.board === boardTab).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  $("#view-board").innerHTML = `
    <div class="toolbar">
      <div class="seg" style="margin:0;flex:1">
        ${CFG.boards.map(b => `<button data-t="${esc(b.key)}" class="${boardTab === b.key ? "active" : ""}">${esc(b.name)}${b.write === "admin" ? " 🔒" : ""}</button>`).join("")}
      </div>
      ${canWrite(cur) ? `<button class="btn small" id="btnPostWrite">＋ 글쓰기</button>` : ""}
    </div>
    <div class="card" style="padding:6px 14px">
      ${posts.length ? posts.map(p => `
        <button class="list-row" data-post="${p.postId}">
          <div class="grow"><div class="t">${esc(p.title)} ${p.comments.length ? `<span style="color:var(--navy);font-size:12.5px">[${p.comments.length}]</span>` : ""}</div>
          <div class="s">${esc(p.authorName)} · ${fmtDate(p.createdAt)} · 조회 ${p.views}</div></div>
        </button>`).join("") : `<div class="empty">게시글이 없습니다.</div>`}
    </div>`;
  $("#view-board").querySelectorAll(".seg button").forEach(b => b.onclick = () => { boardTab = b.dataset.t; renderBoard(); });
  const w = $("#btnPostWrite"); if (w) w.onclick = openPostWrite;
  $("#view-board").querySelectorAll("[data-post]").forEach(b => b.onclick = () => openPostDetail(Number(b.dataset.post)));
  if (param && param.open) openPostDetail(param.open);
}
function openPostWrite() {
  openModal(`
    <h3>글쓰기</h3>
    <label>게시판</label>
    <select id="pwBoard">${CFG.boards.filter(b => canWrite(b)).map(b => `<option value="${esc(b.key)}" ${boardTab === b.key ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select>
    <label>제목</label><input id="pwTitle">
    <label>내용</label><textarea id="pwBody" rows="6"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn ghost" id="pwCancel">취소</button><button class="btn" id="pwSubmit">등록</button>
    </div>`);
  $("#pwCancel").onclick = closeModal;
  $("#pwSubmit").onclick = async () => {
    const title = $("#pwTitle").value.trim(); if (!title) return toast("제목을 입력하세요");
    await DB.add("posts", { board: $("#pwBoard").value, title, body: $("#pwBody").value.trim(), authorId: ME.id, authorName: ME.name, createdAt: new Date().toISOString(), views: 0, comments: [] });
    boardTab = $("#pwBoard").value;
    closeModal(); toast("등록했습니다"); renderBoard();
  };
}
async function openPostDetail(postId) {
  const p = await DB.get("posts", postId);
  if (!p) return toast("게시글을 찾을 수 없습니다");
  p.views++; await DB.put("posts", p);
  openModal(`
    <h3>${esc(p.title)}</h3>
    <div style="font-size:12.5px;color:var(--sub);margin:4px 0 12px">${esc(p.authorName)} · ${fmtDate(p.createdAt)} · 조회 ${p.views}</div>
    <div class="doc-body" style="border-top:1px solid var(--line)">${esc(p.body)}</div>
    <div style="margin-top:12px"><b style="font-size:13.5px">댓글 ${p.comments.length}</b>
      ${p.comments.map(c => `<div class="comment-log"><div class="c"><b>${esc(c.authorName)}</b> ${esc(c.body)} <span style="color:var(--sub);font-size:11.5px">${fmtDate(c.date)}</span></div></div>`).join("")}
    </div>
    <div style="display:flex;gap:6px;margin-top:10px">
      <input id="pdComment" placeholder="댓글 입력…"><button class="btn small" id="pdCmtBtn" style="flex:none">등록</button>
    </div>
    ${(p.authorId === ME.id || ME.role === "admin") ? `<button class="btn danger small" id="pdDel" style="margin-top:12px">글 삭제</button>` : ""}
    <button class="btn ghost" id="pdClose" style="margin-top:10px">닫기</button>`);
  $("#pdClose").onclick = () => { closeModal(); renderBoard(); };
  $("#pdCmtBtn").onclick = async () => {
    const body = $("#pdComment").value.trim(); if (!body) return;
    p.comments.push({ authorId: ME.id, authorName: ME.name, body, date: new Date().toISOString() });
    await DB.put("posts", p); openPostDetail(postId);
  };
  const del = $("#pdDel");
  if (del) del.onclick = async () => { await DB.del("posts", postId); closeModal(); toast("삭제했습니다"); renderBoard(); };
}

/* ── 근태 ── */
let clockTimer = null;
async function renderAttend() {
  const today = CORE.dateStr(new Date());
  const atts = (await DB.all("attendance")).filter(a => a.userId === ME.id);
  const myToday = atts.find(a => a.date === today);
  const ym = CORE.monthStr(new Date());
  const monthAtts = atts.filter(a => a.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date));
  const totalMin = monthAtts.reduce((s, a) => s + (a.workMin || 0), 0);
  const lateN = monthAtts.filter(a => a.status.startsWith("지각")).length;
  // 이번 주(월~일) 집계: 기본/초과/인정근무
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const wkFrom = CORE.dateStr(monday);
  const std = SVC.stdDayMin();
  const wkAtts = atts.filter(a => a.date >= wkFrom && a.date <= today && a.outTime);
  const wkTotal = wkAtts.reduce((s, a) => s + (a.workMin || 0), 0);
  const wkOt = wkAtts.reduce((s, a) => s + Math.max(0, (a.workMin || 0) - std), 0);
  const wkBase = wkTotal - wkOt;
  const leave = await SVC.leaveStatus(ME.id);

  $("#view-attend").innerHTML = `
    <div class="card clock-card">
      <div class="clock-time" id="liveClock">--:--:--</div>
      <div class="clock-date">${today} · 기준 근무시간 ${esc(CFG.work.start)} ~ ${esc(CFG.work.end)} (휴게 ${CFG.work.breakMin}분)</div>
      <div class="clock-btns">
        <button class="btn" id="btnIn" ${myToday ? "disabled" : ""}>출근</button>
        <button class="btn ghost" id="btnOut" ${myToday && !myToday.outTime ? "" : "disabled"}>퇴근</button>
      </div>
      <div class="clock-state">${!myToday ? "아직 출근 전입니다" : myToday.outTime ? `${myToday.inTime} 출근 → ${myToday.outTime} 퇴근 · ${esc(myToday.status)}` : `${myToday.inTime} 출근 · 근무중`}</div>
    </div>
    <div class="card">
      <div class="card-head"><h3>이번 주 근무 집계</h3><span style="font-size:12px;color:var(--sub)">${wkFrom.slice(5)} ~ 오늘</span></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px">
        <div>기본근무 <b>${CORE.minToHM(wkBase)}</b></div>
        <div style="color:var(--stamp)">초과근무 <b>${CORE.minToHM(wkOt)}</b></div>
        <div style="color:var(--navy)">인정근무 <b>${CORE.minToHM(wkTotal)}</b></div>
      </div>
      <div style="height:8px;background:var(--paper);border-radius:99px;overflow:hidden;margin-top:10px;display:flex">
        <div style="width:${Math.min(100, wkBase / (40 * 60) * 100)}%;background:var(--navy)"></div>
        <div style="width:${Math.min(100, wkOt / (40 * 60) * 100)}%;background:var(--stamp)"></div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="k">${ym} 근무일</div><div class="v">${monthAtts.length}<small>일</small></div></div>
      <div class="stat"><div class="k">누적 근무시간</div><div class="v" style="font-size:17px;padding-top:4px">${CORE.minToHM(totalMin)}</div></div>
      <div class="stat"><div class="k">지각</div><div class="v">${lateN}<small>회</small></div></div>
      ${ME.empType !== "daily" ? `<div class="stat"><div class="k">연차 잔여</div><div class="v">${leave.remain}<small>/ ${leave.granted}일</small></div></div>` : ""}
    </div>
    <div class="card">
      <div class="card-head"><h3>이달 근태 기록</h3><button class="more" id="btnReqWork">근무/휴가 신청 ›</button></div>
      <div class="table-wrap"><table class="grid">
        <tr><th>날짜</th><th>출근</th><th>퇴근</th><th>근무</th><th>상태</th></tr>
        ${monthAtts.length ? monthAtts.map(a => `<tr><td>${a.date.slice(5)}</td><td>${a.inTime || "-"}</td><td>${a.outTime || "-"}</td><td>${a.workMin ? CORE.minToHM(a.workMin) : "-"}</td><td>${esc(a.status)}</td></tr>`).join("") : `<tr><td colspan="5" style="color:var(--sub)">기록 없음</td></tr>`}
      </table></div>
    </div>`;
  const tick = () => { const el = $("#liveClock"); if (el) el.textContent = new Date().toTimeString().slice(0, 8); };
  clearInterval(clockTimer); clockTimer = setInterval(tick, 1000); tick();
  $("#btnIn").onclick = async () => {
    const r = await SVC.clockIn(ME);
    toast(r.ok ? `출근 완료 (${r.inTime})` : r.msg); renderAttend();
  };
  $("#btnOut").onclick = async () => {
    const r = await SVC.clockOut(ME);
    toast(r.ok ? `퇴근 완료 (${r.outTime})` : r.msg); renderAttend();
  };
  $("#btnReqWork").onclick = () => go("approval", "req");
}

/* ── 급여 ── */
let payMasked = true;
const PF = n => payMasked ? "•••,•••" : F(n);
async function renderPay() {
  const slips = (await DB.all("payroll")).filter(p => p.userId === ME.id).sort((a, b) => b.ym.localeCompare(a.ym));
  $("#view-pay").innerHTML = `
    <div class="toolbar">
      <button class="btn small ghost" id="btnPayMask">${payMasked ? "🔓 금액 표시" : "🔒 금액 숨김"}</button>
      ${ME.role === "admin" ? `<button class="btn small" id="btnGoPayAdmin">급여 등록 ›</button>` : "<span></span>"}
    </div>
    ${slips.length ? slips.map(p => paySlipHtml(p)).join("") : `<div class="card"><div class="empty">발급된 급여명세서가 없습니다.</div></div>`}
    ${CFG.payPolicy ? `<div class="card"><h3 style="font-size:14px">📌 급여 지침</h3><div style="white-space:pre-wrap;font-size:13px;color:var(--sub);margin-top:6px">${esc(CFG.payPolicy)}</div></div>` : ""}
    <div class="card" style="font-size:12px;color:var(--sub)">공제액은 설정된 요율과 간이세액표 근사치 기반의 참고용 계산입니다. 소득세 1,000원 미만은 소액부징수로 0원 처리됩니다.</div>`;
  const g = $("#btnGoPayAdmin"); if (g) g.onclick = () => go("admin");
  $("#btnPayMask").onclick = () => { payMasked = !payMasked; renderPay(); };
}
function paySlipHtml(p) {
  const isBonus = p.kind === "bonus";
  return `<div class="card">
    <div class="card-head">
      <h3>${p.ym} ${isBonus ? esc(p.label || "성과급") + " 명세서" : "급여명세서"}
        ${p.issued ? `<span class="pill ok" style="vertical-align:2px">발급</span>` : ""}</h3>
      <span class="pay-net">${PF(p.net)}원</span></div>
    ${!isBonus && p.empType === "daily" ? `<div style="font-size:12.5px;color:var(--sub);margin-bottom:4px">일용직 · 일당 ${PF(p.dailyWage)}원 × ${p.workDays}일${p.otMin ? ` · 초과 ${CORE.minToHM(p.otMin)}` : ""}</div>` : ""}
    ${!isBonus && p.empType !== "daily" && p.otMin ? `<div style="font-size:12.5px;color:var(--sub);margin-bottom:4px">근무 ${p.workDays ?? "-"}일 · 초과근무 ${CORE.minToHM(p.otMin)} 자동 반영${p.lateN ? ` · 지각 ${p.lateN}회` : ""}</div>` : ""}
    <table class="pay-table">
      <tr><td>${p.kind === "bonus" ? "성과급" : p.empType === "daily" ? "일당 합계" : "기본급"}</td><td>${PF(p.base)}</td></tr>
      ${p.kind === "bonus" ? "" : p.empType === "daily" ? `<tr><td>연장근로수당</td><td>${PF(p.overtime)}</td></tr>` : `<tr><td>제수당</td><td>${PF(p.allowance)}</td></tr>
      <tr><td>연장근로수당</td><td>${PF(p.overtime)}</td></tr>`}
      <tr class="sum"><td>지급 합계</td><td>${PF(p.gross)}</td></tr>
      ${p.empType === "daily" ? "" : `<tr class="deduct"><td>국민연금</td><td>-${PF(p.pension)}</td></tr>
      <tr class="deduct"><td>건강보험</td><td>-${PF(p.health)}</td></tr>
      <tr class="deduct"><td>장기요양보험</td><td>-${PF(p.care)}</td></tr>`}
      <tr class="deduct"><td>고용보험</td><td>-${PF(p.employ)}</td></tr>
      <tr class="deduct"><td>소득세</td><td>-${PF(p.incomeTax)}</td></tr>
      <tr class="deduct"><td>지방소득세</td><td>-${PF(p.localTax)}</td></tr>
      <tr class="sum"><td>공제 합계</td><td style="color:var(--stamp)">-${PF(p.totalDeduct)}</td></tr>
      <tr class="sum"><td>실수령액</td><td style="color:var(--navy)">${PF(p.net)}원</td></tr>
    </table></div>`;
}

/* ── 관리자 ── */
let adminTab = "emp";
async function renderAdmin() {
  if (ME.role !== "admin") { $("#view-admin").innerHTML = `<div class="card"><div class="empty">관리자 전용 메뉴입니다.</div></div>`; return; }
  $("#view-admin").innerHTML = `
    <div class="seg">
      <button data-t="emp" class="${adminTab === "emp" ? "active" : ""}">사원</button>
      <button data-t="payg" class="${adminTab === "payg" ? "active" : ""}">급여</button>
      <button data-t="docs" class="${adminTab === "docs" ? "active" : ""}">문서관리</button>
      <button data-t="audit" class="${adminTab === "audit" ? "active" : ""}">감사</button>
      <button data-t="att" class="${adminTab === "att" ? "active" : ""}">근태</button>
      <button data-t="cfg" class="${adminTab === "cfg" ? "active" : ""}">설정</button>
    </div>
    <div id="adminBody"></div>`;
  $("#view-admin").querySelectorAll(".seg button").forEach(b => b.onclick = () => { adminTab = b.dataset.t; renderAdmin(); });
  if (adminTab === "emp") renderAdminEmp();
  if (adminTab === "payg") renderAdminPay();
  if (adminTab === "docs") renderAdminDocs();
  if (adminTab === "audit") renderAdminAudit();
  if (adminTab === "att") renderAdminAtt();
  if (adminTab === "cfg") renderAdminCfg();
}
async function renderAdminEmp() {
  USERS = await DB.all("users");
  $("#adminBody").innerHTML = `
    <div class="toolbar"><h3>사원 ${USERS.length}명</h3><button class="btn small" id="btnEmpAdd">＋ 사원 등록</button></div>
    <div class="card" style="padding:6px 14px">
      ${USERS.map(u => `
        <button class="list-row" data-emp="${u.id}">
          <span class="avatar">${esc(u.name[0])}</span>
          <div class="grow"><div class="t">${esc(u.name)} ${esc(u.position)} ${u.role === "admin" ? `<span class="pill ing">관리자</span>` : ""}</div>
          <div class="s">${esc(u.id)} · ${esc(u.dept)} · ${u.empType === "daily" ? `일용직 · 일당 ${F(u.dailyWage)}원` : `기본급 ${F(u.salaryBase)}원`}</div></div>
        </button>`).join("")}
    </div>`;
  $("#btnEmpAdd").onclick = () => openEmpForm();
  $("#adminBody").querySelectorAll("[data-emp]").forEach(b => b.onclick = () => openEmpForm(b.dataset.emp));
}
async function openEmpForm(id) {
  const u = id ? await DB.get("users", id) : null;
  openModal(`
    <h3>${u ? "사원 정보 수정" : "사원 등록"}</h3>
    <label>사번</label><input id="efId" value="${u ? esc(u.id) : ""}" ${u ? "disabled" : ""} inputmode="numeric">
    <label>이름</label><input id="efName" value="${u ? esc(u.name) : ""}">
    <div class="row2">
      <div><label>부서</label><input id="efDept" value="${u ? esc(u.dept) : ""}" placeholder="예: 하우스팀"></div>
      <div><label>직급</label><input id="efPos" value="${u ? esc(u.position) : ""}" placeholder="예: 사원"></div>
    </div>
    <div class="row2">
      <div><label>고용형태</label><select id="efType"><option value="regular" ${!u || u.empType !== "daily" ? "selected" : ""}>정규직(월급)</option><option value="daily" ${u && u.empType === "daily" ? "selected" : ""}>일용직(일당)</option></select></div>
      <div><label>권한</label><select id="efRole"><option value="user" ${u && u.role === "user" ? "selected" : ""}>일반</option><option value="admin" ${u && u.role === "admin" ? "selected" : ""}>관리자</option></select></div>
    </div>
    <div class="row2">
      <div id="efSalWrap"><label>기본급(월)</label><input id="efSal" inputmode="numeric" value="${u ? u.salaryBase : 2500000}"></div>
      <div id="efDailyWrap"><label>일당</label><input id="efDaily" inputmode="numeric" value="${u && u.dailyWage ? u.dailyWage : 100000}"></div>
    </div>
    <div id="efLeaveWrap"><label>연차 부여일수(년)</label><input id="efLeave" inputmode="numeric" value="${u && u.annualLeave != null ? u.annualLeave : 15}"></div>
    <label>비밀번호 ${u ? "(변경 시에만 입력)" : ""}</label><input id="efPw" type="password" placeholder="${u ? "변경하지 않으려면 비워두세요" : "초기 비밀번호"}">
    <div style="display:flex;gap:8px;margin-top:16px">
      ${u && u.id !== ME.id ? `<button class="btn danger" id="efDel">삭제</button>` : ""}
      <button class="btn ghost" id="efCancel">취소</button>
      <button class="btn" id="efSave">저장</button>
    </div>`);
  const syncType = () => {
    const daily = $("#efType").value === "daily";
    $("#efSalWrap").classList.toggle("hidden", daily);
    $("#efDailyWrap").classList.toggle("hidden", !daily);
    $("#efLeaveWrap").classList.toggle("hidden", daily);
  };
  syncType(); $("#efType").onchange = syncType;
  $("#efCancel").onclick = closeModal;
  const del = $("#efDel");
  if (del) del.onclick = async () => { await DB.del("users", id); closeModal(); toast("삭제했습니다"); renderAdminEmp(); };
  $("#efSave").onclick = async () => {
    const nid = $("#efId").value.trim(), name = $("#efName").value.trim();
    if (!nid || !name) return toast("사번과 이름을 입력하세요");
    if (!u && await DB.get("users", nid)) return toast("이미 존재하는 사번입니다");
    const rec = u || { id: nid };
    rec.name = name; rec.dept = $("#efDept").value.trim(); rec.position = $("#efPos").value.trim();
    rec.empType = $("#efType").value;
    rec.salaryBase = rec.empType === "daily" ? 0 : (Number($("#efSal").value) || 0);
    rec.dailyWage = rec.empType === "daily" ? (Number($("#efDaily").value) || 0) : 0;
    rec.role = $("#efRole").value;
    rec.annualLeave = rec.empType === "daily" ? 0 : (Number($("#efLeave").value) || 15);
    rec.joinDate = rec.joinDate || CORE.dateStr(new Date());
    const pw = $("#efPw").value;
    if (pw) rec.pwHash = await sha256(pw);
    else if (!u) return toast("초기 비밀번호를 입력하세요");
    await DB.put("users", rec);

let docsFilter = { status: "all", type: "all", q: "" };

  $("#adminBody").innerHTML = `

      ${docs.length ? docs.map(d => `
        <div class="list-row">
          <button class="grow" data-doc="${d.docId}" style="text-align:left">

          <button class="btn small danger" data-del="${d.docId}" style="padding:6px 10px">삭제</button>
        </div>`).join("") : `<div class="empty">조건에 맞는 문서가 없습니다.</div>`}
    </div>`;
  $("#dfStatus").onchange = e => { docsFilter.status = e.target.value; renderAdminDocs(); };
  $("#dfType").onchange = e => { docsFilter.type = e.target.value; renderAdminDocs(); };
  $("#dfQ").addEventListener("change", e => { docsFilter.q = e.target.value.trim(); renderAdminDocs(); });

    const d = await DB.get("docs", Number(b.dataset.edit));
    if (!d) return;
    openModal(`
      <h3>문서 수정 <span style="font-size:12px;color:var(--sub);font-weight:600">관리자 · 수정 이력 기록</span></h3>

        <button class="btn ghost" id="deCancel">취소</button><button class="btn" id="deSave">저장</button>
      </div>`);
    $("#deCancel").onclick = closeModal;
    $("#deSave").onclick = async () => {
      const r = await SVC.editDoc(d.docId, { title: $("#deTitle").value.trim(), body: $("#deBody").value }, ME);
      if (!r.ok) return toast(r.msg);
      closeModal(); toast("수정했습니다"); renderAdminDocs();
    };

  $("#adminBody").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    await SVC.deleteDoc(Number(b.dataset.del), ME);
    toast("삭제했습니다"); renderAdminDocs();
  });

    toast("급여 설정을 저장했습니다");
  };
  $("#cdSave").onclick = async () => {
    CFG.daily = { taxFree: Number($("#cdFree").value) || 0, employPct: Number($("#cdEmp").value) || 0 };
    await saveCFG("daily"); SVC.log(ME, "설정변경", "일용직 기준");
    toast("일용직 설정을 저장했습니다");
  };
  $("#cgSave").onclick = async () => {
    CFG.payPolicy = $("#cgPolicy").value;
    await saveCFG("payPolicy"); SVC.log(ME, "설정변경", "급여 지침");
    toast("지침을 저장했습니다");
  };
  $("#cbAdd").onclick = () => {
    openModal(`
      <h3>게시판 추가</h3>
      <label>게시판 이름</label><input id="nbName" placeholder="예: 업무자료실">
      <label>쓰기 권한</label><select id="nbWrite"><option value="all">전체 사원</option><option value="admin">관리자만</option></select>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn ghost" id="nbCancel">취소</button><button class="btn" id="nbSave">추가</button>
      </div>`);
    $("#nbCancel").onclick = closeModal;
    $("#nbSave").onclick = async () => {
      const name = $("#nbName").value.trim();
      if (!name) return toast("이름을 입력하세요");
      const key = "b" + Date.now();
      CFG.boards.push({ key, name, write: $("#nbWrite").value });
      await saveCFG("boards"); SVC.log(ME, "게시판추가", name);
      closeModal(); toast("게시판을 추가했습니다"); renderAdminCfg();
    };
  };
  $("#adminBody").querySelectorAll("[data-perm]").forEach(b => b.onclick = async () => {
    const bd = CFG.boards[Number(b.dataset.perm)];
    bd.write = bd.write === "admin" ? "all" : "admin";
    await saveCFG("boards"); SVC.log(ME, "게시판권한변경", `${bd.name} → ${bd.write}`);
    renderAdminCfg();
  });
  $("#adminBody").querySelectorAll("[data-bdel]").forEach(b => b.onclick = async () => {
    if (CFG.boards.length <= 1) return toast("최소 1개 게시판은 유지해야 합니다");
    const bd = CFG.boards[Number(b.dataset.bdel)];
    const posts = (await DB.all("posts")).filter(p => p.board === bd.key);
    openModal(`
      <h3>게시판 삭제</h3>
      <div style="margin-top:8px;font-size:14px"><b>${esc(bd.name)}</b> 게시판과 게시글 <b style="color:var(--stamp)">${posts.length}건</b>이 함께 삭제됩니다. 계속할까요?</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn ghost" id="bdCancel">취소</button><button class="btn danger" id="bdOk">삭제</button>
      </div>`);
    $("#bdCancel").onclick = closeModal;
    $("#bdOk").onclick = async () => {
      for (const p of posts) await DB.del("posts", p.postId);
      CFG.boards.splice(Number(b.dataset.bdel), 1);
      await saveCFG("boards"); SVC.log(ME, "게시판삭제", `${bd.name} (글 ${posts.length}건)`);
      closeModal(); toast("삭제했습니다"); renderAdminCfg();
    };
  });
  $("#cbExport").onclick = async () => {
    const dump = {};
    for (const st of ["users", "docs", "posts", "payroll", "attendance", "auditlog", "settings"]) dump[st] = await DB.all(st);
    try {
      const blob = new Blob([JSON.stringify(dump, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `groupware-backup-${CORE.dateStr(new Date())}.json`;
      a.click(); URL.revokeObjectURL(a.href);
      SVC.log(ME, "백업내보내기");
      toast("백업 파일을 내려받습니다");
    } catch (e) { toast("이 환경에서는 내보내기를 지원하지 않습니다"); }
  };
  $("#cbImport").addEventListener("change", async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const dump = JSON.parse(await file.text());
      for (const st of ["users", "docs", "posts", "payroll", "attendance", "auditlog", "settings"]) {
        if (!Array.isArray(dump[st])) continue;
        for (const row of await DB.all(st)) {
          const keyName = { users: "id", docs: "docId", posts: "postId", payroll: "payId", attendance: "attId", auditlog: "logId", settings: "key" }[st];
          await DB.del(st, row[keyName]);
        }
        for (const row of dump[st]) await DB.put(st, row);
      }
      await loadCFG();
      SVC.log(ME, "백업가져오기", file.name);
      toast("복원했습니다"); renderAdminCfg();
    } catch (err) { toast("잘못된 백업 파일입니다"); }
  });
  $("#cbReset").onclick = () => {
    openModal(`
      <h3>전체 초기화</h3>
      <div style="margin-top:8px;font-size:14px">모든 데이터가 삭제되고 샘플 데이터로 재시작합니다. 되돌릴 수 없습니다.</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn ghost" id="rsCancel">취소</button><button class="btn danger" id="rsOk">초기화</button>
      </div>`);
    $("#rsCancel").onclick = closeModal;
    $("#rsOk").onclick = () => { indexedDB.deleteDatabase("groupwareDB"); sessionStorage.clear(); location.reload(); };
  };
}

async function renderAdminAtt() {
  const ymSel = $("#aaYm")?.value || CORE.monthStr(new Date());
  const atts = (await DB.all("attendance")).filter(a => a.date.startsWith(ymSel)).sort((a, b) => b.date.localeCompare(a.date));
  $("#adminBody").innerHTML = `
    <div class="card">
      <div class="card-head"><h3>근태 기록 관리</h3><button class="btn small" id="aaAdd">＋ 수동 추가</button></div>
      <label style="margin-top:0">조회 연월</label><input type="month" id="aaYm" value="${ymSel}">
      <div class="table-wrap" style="margin-top:12px"><table class="grid">
        <tr><th>날짜</th><th>사원</th><th>출근</th><th>퇴근</th><th>상태</th><th>관리</th></tr>
        ${atts.length ? atts.map(a => `<tr><td>${a.date.slice(5)}</td><td>${esc(a.userName)}</td><td>${a.inTime || "-"}</td><td>${a.outTime || "-"}</td><td>${esc(a.status)}</td>
          <td><button class="btn small ghost" data-edit="${a.attId}" style="padding:4px 8px">수정</button>
              <button class="btn small danger" data-del="${a.attId}" style="padding:4px 8px">삭제</button></td></tr>`).join("")
        : `<tr><td colspan="6" style="color:var(--sub)">기록 없음</td></tr>`}
      </table></div>
      <div style="font-size:12px;color:var(--sub);margin-top:8px">수정·삭제는 전건 활동 로그에 기록되며, 상태는 설정된 근무시간 기준으로 자동 재판정됩니다.</div>
    </div>`;
  $("#aaYm").onchange = renderAdminAtt;
  $("#aaAdd").onclick = () => openAttForm();
  $("#adminBody").querySelectorAll("[data-edit]").forEach(b => b.onclick = async () => openAttForm(await DB.get("attendance", Number(b.dataset.edit))));
  $("#adminBody").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    await SVC.deleteAttendance(Number(b.dataset.del), ME);
    toast("삭제했습니다"); renderAdminAtt();
  });
}
async function openAttForm(a) {
  USERS = await DB.all("users");
  openModal(`
    <h3>${a ? "근태 기록 수정" : "근태 수동 추가"}</h3>
    <label>사원</label>
    <select id="afUser" ${a ? "disabled" : ""}>${USERS.map(u => `<option value="${u.id}" ${a && a.userId === u.id ? "selected" : ""}>${esc(u.name)} ${esc(u.position)}</option>`).join("")}</select>
    <label>날짜</label><input type="date" id="afDate" value="${a ? a.date : CORE.dateStr(new Date())}" ${a ? "disabled" : ""}>
    <div class="row2">
      <div><label>출근 시각</label><input type="time" id="afIn" value="${a ? a.inTime : "09:00"}"></div>
      <div><label>퇴근 시각</label><input type="time" id="afOut" value="${a && a.outTime ? a.outTime : ""}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn ghost" id="afCancel">취소</button><button class="btn" id="afSave">저장</button>
    </div>`);
  $("#afCancel").onclick = closeModal;
  $("#afSave").onclick = async () => {
    const r = await SVC.upsertAttendance({
      attId: a ? a.attId : null, userId: $("#afUser").value, date: $("#afDate").value,
      inTime: $("#afIn").value, outTime: $("#afOut").value || null,
    }, ME);
    if (!r.ok) return toast(r.msg);
    closeModal(); toast(`저장했습니다 (${r.status})`); renderAdminAtt();
  };
}

/* ── 초기화 ── */
async function init() {
  await DB.open();
  const seeded = await seedIfEmpty();
  await loadCFG();
  $("#btnLogin").onclick = doLogin;
  $("#loginPw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("#btnLogout").onclick = doLogout;
  $("#btnLogout2").onclick = doLogout;
  $$(".nav-item[data-view],.tab[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
  // 세션 복원
  const uid = sessionStorage.getItem("gw_uid");
  if (uid) { const u = await DB.get("users", uid); if (u) { ME = u; await enterApp(); } }
  if (seeded) console.log("[groupware] 샘플 데이터 생성 완료");
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
