<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>결재온 그룹웨어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" onerror="this.remove()">
<style>
:root{
  --paper:#F3F4F6; --card:#FFFFFF; --ink:#1E2430; --sub:#6C7482; --line:#E2E5EA;
  --navy:#2C4A66; --navy-d:#20374C; --navy-t:#EAF0F5;
  --stamp:#C13B2E; --stamp-t:#FBEEEC;
  --ok:#2F7D5C; --ok-t:#E9F3EE; --warn:#B67A1F; --warn-t:#F9F1E2;
  --r:12px; --shadow:0 1px 3px rgba(30,36,48,.08);
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  background:var(--paper); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; font-size:inherit; color:inherit}
input,select,textarea{
  font-family:inherit; font-size:15px; color:var(--ink);
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; width:100%; background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy); outline-offset:-1px; border-color:var(--navy)}
label{display:block; font-size:13px; font-weight:600; color:var(--sub); margin:14px 0 5px}
h2{font-size:19px; font-weight:700}
h3{font-size:16px; font-weight:700}
.hidden{display:none!important}

/* ── 인장(도장) 로고 ── */
.seal{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border:2px solid var(--stamp); border-radius:8px;
  color:var(--stamp); font-weight:800; font-size:17px; background:#fff;
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3px rgba(193,59,46,.35);
  transform:rotate(-4deg); flex:none;
}

/* ── 로그인 ── */
#loginView{
  min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(160deg,var(--navy-d) 0%,var(--navy) 60%,#3A5F80 100%); padding:24px;
}
.login-card{background:#fff; border-radius:16px; padding:34px 28px; width:100%; max-width:380px; box-shadow:0 12px 40px rgba(0,0,0,.25)}
.login-brand{display:flex; align-items:center; gap:12px; margin-bottom:6px}
.login-brand .seal{width:44px; height:44px; font-size:22px}
.login-brand h1{font-size:24px; font-weight:800; letter-spacing:-.5px}
.login-sub{color:var(--sub); font-size:13px; margin-bottom:10px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--navy); color:#fff; font-weight:700; border-radius:9px;
  padding:12px 18px; width:100%; margin-top:18px; transition:background .15s;
}
.btn:hover{background:var(--navy-d)}
.btn.small{width:auto; padding:8px 14px; font-size:13px; margin-top:0}
.btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line)}
.btn.ghost:hover{background:var(--navy-t)}
.btn.danger{background:var(--stamp)}
.btn.danger:hover{background:#A32F24}
.btn:disabled{opacity:.5; cursor:not-allowed}
.login-hint{margin-top:16px; padding:11px 13px; background:var(--paper); border-radius:8px; font-size:12.5px; color:var(--sub)}
.login-err{color:var(--stamp); font-size:13px; margin-top:12px; font-weight:600}

/* ── 앱 레이아웃 ── */
#appView{display:flex; min-height:100dvh}
.sidebar{
  width:228px; flex:none; background:var(--navy-d); color:#fff; padding:20px 14px;
  display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100dvh;
}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px; font-size:18px; font-weight:800}
.sidebar .brand .seal{background:var(--navy-d); border-color:#E8A79F; color:#F3C2BB; box-shadow:none; width:30px; height:30px; font-size:15px}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:9px;
  color:#C6D2DD; font-weight:600; font-size:14.5px; text-align:left; width:100%;
}
.nav-item .ico{font-size:17px; width:22px; text-align:center}
.nav-item:hover{background:rgba(255,255,255,.08); color:#fff}
.nav-item.active{background:rgba(255,255,255,.14); color:#fff}
.nav-badge{margin-left:auto; background:var(--stamp); color:#fff; font-size:11px; font-weight:700; border-radius:99px; padding:1px 7px}
.sidebar .spacer{flex:1}
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  background:#fff; border-bottom:1px solid var(--line); padding:12px 20px;
  display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:20;
}
.topbar .title{font-size:17px; font-weight:800; flex:1}
.user-chip{display:flex; align-items:center; gap:9px; font-size:13.5px}
.avatar{
  width:32px; height:32px; border-radius:50%; background:var(--navy-t); color:var(--navy);
  display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none;
}
.content{padding:18px 20px 90px; max-width:920px; width:100%; margin:0 auto}

/* 모바일 하단 탭 */
.tabbar{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:#fff; border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar .tabs{display:flex}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  font-size:10.5px; font-weight:600; color:var(--sub); padding:5px 0; position:relative;
}
.tab .ico{font-size:20px}
.tab.active{color:var(--navy)}
.tab .dot{position:absolute; top:2px; right:calc(50% - 16px); width:8px; height:8px; border-radius:50%; background:var(--stamp)}
@media(max-width:820px){
  .sidebar{display:none}
  .tabbar{display:block}
  .content{padding:14px 14px 96px}
}

/* ── 카드/리스트 공통 ── */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:18px; margin-bottom:14px}
.card .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px}
.card .card-head .more{font-size:13px; color:var(--sub); font-weight:600}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px}
.stat{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow)}
.stat .k{font-size:12.5px; color:var(--sub); font-weight:600}
.stat .v{font-size:22px; font-weight:800; margin-top:2px}
.stat .v small{font-size:13px; font-weight:600; color:var(--sub)}
.list-row{
  display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);
  width:100%; text-align:left;
}
.list-row:last-child{border-bottom:none}
.list-row .grow{flex:1; min-width:0}
.list-row .t{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.list-row .s{font-size:12.5px; color:var(--sub); margin-top:1px}
.pill{font-size:11.5px; font-weight:700; border-radius:99px; padding:3px 10px; flex:none}
.pill.wait{background:var(--warn-t); color:var(--warn)}
.pill.ok{background:var(--ok-t); color:var(--ok)}
.pill.no{background:var(--stamp-t); color:var(--stamp)}
.pill.ing{background:var(--navy-t); color:var(--navy)}
.empty{padding:34px 10px; text-align:center; color:var(--sub); font-size:13.5px}
.seg{display:flex; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:14px; overflow-x:auto}
.seg button{flex:1; padding:8px 12px; border-radius:8px; font-size:13.5px; font-weight:700; color:var(--sub); white-space:nowrap}
.seg button.active{background:var(--navy); color:#fff}
.toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
table.grid{width:100%; border-collapse:collapse; font-size:13.5px}
table.grid th{background:var(--paper); font-weight:700; color:var(--sub); font-size:12.5px}
table.grid th,table.grid td{border:1px solid var(--line); padding:8px 9px; text-align:center}
table.grid td.l{text-align:left}
table.grid td.r{text-align:right}
.table-wrap{overflow-x:auto}

/* ── 결재 문서 상세 + 도장 ── */
.doc-sheet{background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:22px 20px; box-shadow:var(--shadow)}
.doc-sheet .doc-title{font-size:19px; font-weight:800; padding-bottom:12px; border-bottom:2px solid var(--ink)}
.doc-meta{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13.5px; margin:12px 0; color:var(--sub)}
.doc-meta b{color:var(--ink)}
.doc-body{white-space:pre-wrap; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); min-height:80px}
.appr-line{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
.appr-box{
  border:1.5px solid var(--line); border-radius:10px; width:96px; text-align:center; overflow:hidden; background:#fff;
}
.appr-box .role{background:var(--paper); font-size:11px; font-weight:700; color:var(--sub); padding:4px}
.appr-box .sign{height:64px; display:flex; align-items:center; justify-content:center; position:relative}
.appr-box .nm{font-size:12px; padding:4px; border-top:1px solid var(--line); font-weight:600}
.stamp-mark{
  width:52px; height:52px; border-radius:50%; border:2.5px solid var(--stamp); color:var(--stamp);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;
  box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3.5px rgba(193,59,46,.45);
  transform:rotate(-8deg); letter-spacing:1px;
  animation:stampIn .25s cubic-bezier(.2,1.6,.4,1);
}
.stamp-mark.reject{border-color:#555; color:#555; box-shadow:inset 0 0 0 2px #fff, inset 0 0 0 3.5px rgba(85,85,85,.4)}
@keyframes stampIn{from{transform:rotate(-8deg) scale(1.6); opacity:0}to{transform:rotate(-8deg) scale(1); opacity:1}}
@media(prefers-reduced-motion:reduce){.stamp-mark{animation:none}}
.appr-wait{color:#C9CED6; font-size:12px; font-weight:700}
.comment-log{margin-top:14px; font-size:13px}
.comment-log .c{padding:8px 10px; background:var(--paper); border-radius:8px; margin-top:6px}

/* ── 근태 시계 ── */
.clock-card{text-align:center; padding:26px 18px}
.clock-time{font-size:38px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums}
.clock-date{color:var(--sub); font-size:13.5px; margin-bottom:14px}
.clock-btns{display:flex; gap:10px; justify-content:center}
.clock-btns .btn{width:auto; min-width:120px; margin-top:0}
.clock-state{margin-top:12px; font-size:13.5px; color:var(--sub)}

/* ── 급여 명세 ── */
.pay-net{font-size:26px; font-weight:800; color:var(--navy)}
.pay-table{width:100%; font-size:13.5px; border-collapse:collapse; margin-top:10px}
.pay-table td{padding:7px 2px; border-bottom:1px dashed var(--line)}
.pay-table td:last-child{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.pay-table tr.sum td{border-bottom:none; font-weight:800; padding-top:10px}
.pay-table tr.deduct td:last-child{color:var(--stamp)}

/* ── 스케줄 달력 ── */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .ym{font-size:17px;font-weight:800}
.cal-nav{display:flex;gap:6px}
.cal-nav button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px 12px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.cal .dow{background:var(--paper);text-align:center;font-size:11.5px;font-weight:700;color:var(--sub);padding:7px 0;border-bottom:1px solid var(--line)}
.cal .dow.sun{color:var(--stamp)} .cal .dow.sat{color:var(--navy)}
.cal .day{min-height:86px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;text-align:left;vertical-align:top;background:#fff;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .day:nth-child(7n){border-right:none}
.cal .day .dn{font-size:11.5px;font-weight:700}
.cal .day.dim{background:#FAFBFC}.cal .day.dim .dn{color:#C4C9D2}
.cal .day.today{outline:2px solid var(--navy);outline-offset:-2px}
.cal .day.sun .dn{color:var(--stamp)}.cal .day.sat .dn{color:var(--navy)}
.ev{font-size:10px;font-weight:700;background:#6C5CE7;color:#fff;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh{font-size:10px;font-weight:600;border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--navy-t);color:var(--navy)}
.sh.fix{background:var(--ok-t);color:var(--ok)}
.sh.mine{outline:1.5px solid var(--navy)}
@media(max-width:600px){.cal .day{min-height:66px}.ev,.sh{font-size:9px}}
@media(min-width:1200px){
  .content{max-width:1160px}
  .cal .day{min-height:118px}
  .ev,.sh{font-size:11px}
  .doc-sheet{padding:30px 34px}
}
.day-modal-list .list-row{padding:9px 2px}

/* 모달 */
.modal-bg{position:fixed; inset:0; background:rgba(20,26,36,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:#fff; border-radius:16px 16px 0 0; width:100%; max-width:520px; max-height:88dvh; overflow-y:auto; padding:22px 20px 26px}
@media(min-width:600px){.modal{border-radius:16px}}
.modal h3{margin-bottom:4px}
.toast{
  position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:99;
  background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
  padding:10px 18px; border-radius:99px; box-shadow:0 6px 20px rgba(0,0,0,.25);
  opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1}
.appr-picked{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.appr-picked .chip{background:var(--navy-t); color:var(--navy); font-size:12.5px; font-weight:700; padding:4px 10px; border-radius:99px; display:inline-flex; gap:6px; align-items:center}
.appr-picked .chip button{color:var(--navy); font-weight:800}
</style>
</head>
<body>

<!-- ══════════ 로그인 ══════════ -->
<div id="loginView">
  <div class="login-card">
    <div class="login-brand"><span class="seal">決</span><h1>결재온</h1></div>
    <div class="login-sub">사내 그룹웨어 · 전자결재 / 게시판 / 근태 / 급여</div>
    <label for="loginId">사번</label>
    <input id="loginId" inputmode="numeric" autocomplete="username" placeholder="예: 1001">
    <label for="loginPw">비밀번호</label>
    <input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호 입력">
    <div id="loginErr" class="login-err hidden"></div>
    <button class="btn" id="btnLogin">로그인</button>
    <button class="btn ghost" id="btnSignup" style="margin-top:8px">회원가입 (사원 신규 등록)</button>
    <div class="login-hint" id="loginHint">
      데모 계정 — 관리자: <b>1001 / admin1234</b> · 사원: <b>1002 / 1234</b><br>
      최초 실행 시 샘플 데이터가 자동 생성됩니다.
    </div>
    <button id="btnSrvCfg" style="margin-top:12px;font-size:12.5px;color:var(--sub);text-decoration:underline;width:100%">⚙️ 서버 연결 설정 (60명 공용 모드)</button>
  </div>
</div>

<!-- ══════════ 앱 ══════════ -->
<div id="appView" class="hidden">
  <nav class="sidebar" id="sideNav">
    <div class="brand"><span class="seal">決</span>결재온</div>
    <button class="nav-item" data-view="home"><span class="ico">🏠</span>홈</button>
    <button class="nav-item" data-view="approval"><span class="ico">🖋️</span>전자결재<span class="nav-badge hidden" id="badgeAppr">0</span></button>
    <button class="nav-item" data-view="schedule"><span class="ico">🗓️</span>근무 스케줄</button>
    <button class="nav-item" data-view="board"><span class="ico">📋</span>게시판</button>
    <button class="nav-item" data-view="attend"><span class="ico">⏰</span>근태관리</button>
    <button class="nav-item" data-view="pay"><span class="ico">💰</span>급여</button>
    <button class="nav-item hidden" data-view="admin" id="navAdmin"><span class="ico">⚙️</span>관리자</button>
    <div class="spacer"></div>
    <button class="nav-item" id="btnLogout"><span class="ico">🚪</span>로그아웃</button>
  </nav>

  <div class="main">
    <header class="topbar">
      <span class="seal" style="width:28px;height:28px;font-size:14px" aria-hidden="true">決</span>
      <span class="title" id="topTitle">홈</span>
      <span id="modeBadge" style="font-size:11px;font-weight:700;color:var(--sub)"></span>
      <button id="btnBell" style="position:relative;font-size:19px;padding:4px" aria-label="알림">🔔<span id="bellBadge" class="nav-badge hidden" style="position:absolute;top:-2px;right:-6px">0</span></button>
      <span class="user-chip"><span class="avatar" id="topAvatar">?</span><span id="topName"></span></span>
      <button class="btn small ghost" id="btnLogout2">로그아웃</button>
    </header>

    <div class="content">
      <!-- 홈 -->
      <section id="view-home"></section>
      <!-- 전자결재 -->
      <section id="view-approval" class="hidden"></section>
      <!-- 스케줄 -->
      <section id="view-schedule" class="hidden"></section>
      <!-- 게시판 -->
      <section id="view-board" class="hidden"></section>
      <!-- 근태 -->
      <section id="view-attend" class="hidden"></section>
      <!-- 급여 -->
      <section id="view-pay" class="hidden"></section>
      <!-- 관리자 -->
      <section id="view-admin" class="hidden"></section>
    </div>
  </div>

  <nav class="tabbar"><div class="tabs">
    <button class="tab" data-view="home"><span class="ico">🏠</span>홈</button>
    <button class="tab" data-view="approval"><span class="ico">🖋️</span>결재<span class="dot hidden" id="tabDotAppr"></span></button>
    <button class="tab" data-view="schedule"><span class="ico">🗓️</span>스케줄</button>
    <button class="tab" data-view="board"><span class="ico">📋</span>게시판</button>
    <button class="tab" data-view="attend"><span class="ico">⏰</span>근태</button>
    <button class="tab" data-view="pay"><span class="ico">💰</span>급여</button>
  </div></nav>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<!-- ══════════ 핵심 로직 (DOM 무관 · 단위테스트 대상) ══════════ -->
<script id="coreLogic">
"use strict";
const CORE = (() => {

  const fmtMoney = n => (n ?? 0).toLocaleString("ko-KR");
  const pad2 = n => String(n).padStart(2, "0");
  const dateStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const monthStr = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  const timeStr = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  const floor10 = n => Math.floor(Math.round(n) / 10) * 10;

  /* ── 급여: 4대보험 + 간이 소득세(근사) + 소액부징수 ──
     요율(2025~26 기준 근사): 국민연금 4.5%(기준소득월액 상한 637만),
     건강보험 3.545%, 장기요양 = 건강보험료의 12.95%, 고용보험 0.9% */
  function estimateIncomeTax(taxableMonthly, dependents = 1) {
    // 간이세액표 근사식(프로토타입): 연환산 과세표준 누진 적용 후 월할
    if (taxableMonthly < 1_060_000) return 0;      // 간이세액표 과세 하한
    const annual = taxableMonthly * 12;
    const laborDeduct =
      annual <= 5_000_000 ? annual * 0.7 :
      annual <= 15_000_000 ? 3_500_000 + (annual - 5_000_000) * 0.4 :
      annual <= 45_000_000 ? 7_500_000 + (annual - 15_000_000) * 0.15 :
      annual <= 100_000_000 ? 12_000_000 + (annual - 45_000_000) * 0.05 :
      14_750_000 + (annual - 100_000_000) * 0.02;
    const personal = 1_500_000 * Math.max(1, dependents);
    const base = Math.max(0, annual - laborDeduct - personal);
    let tax =
      base <= 14_000_000 ? base * 0.06 :
      base <= 50_000_000 ? 840_000 + (base - 14_000_000) * 0.15 :
      base <= 88_000_000 ? 6_240_000 + (base - 50_000_000) * 0.24 :
      base <= 150_000_000 ? 15_360_000 + (base - 88_000_000) * 0.35 :
      37_060_000 + (base - 150_000_000) * 0.38;
    // 근로소득세액공제(간이 근사): 산출세액 55%/30%, 한도 74만
    const credit = Math.min(740_000, tax <= 1_300_000 ? tax * 0.55 : 715_000 + (tax - 1_300_000) * 0.30);
    tax = Math.max(0, tax - credit);
    return floor10(tax / 12);
  }

  const DEFAULT_RATES = { pension: 0.045, health: 0.03545, careOfHealth: 0.1295, employ: 0.009, npCap: 6_370_000 };
  function calcPayroll({ base = 0, allowance = 0, overtime = 0, mealTaxFree = 200_000, dependents = 1, rates = DEFAULT_RATES }) {
    const R = { ...DEFAULT_RATES, ...rates };
    const gross = base + allowance + overtime;
    const taxable = Math.max(0, gross - Math.min(mealTaxFree, gross));
    const npBase = Math.min(taxable, R.npCap);
    const pension = floor10(npBase * R.pension);
    const health  = floor10(taxable * R.health);
    const care    = floor10(health * R.careOfHealth);
    const employ  = floor10(taxable * R.employ);
    let incomeTax = estimateIncomeTax(taxable, dependents);
    if (incomeTax < 1000) incomeTax = 0;            // 소액부징수
    const localTax = floor10(incomeTax * 0.1);
    const totalDeduct = pension + health + care + employ + incomeTax + localTax;
    return { gross, taxable, pension, health, care, employ, incomeTax, localTax, totalDeduct, net: gross - totalDeduct };
  }

  /* ── 일용직 급여: 일당 기준, 고용보험만 적용
     일용근로소득세 = (일당 - 비과세한도) × 6% × 45%(=2.7%), 일별 소액부징수(1,000원 미만 0) ── */
  function calcDailyPayroll({ dailyWage = 0, days = 0, otMin = 0, otMult = 1.5, nightMin = 0, juhyuMin = 0, holidayMin = 0,
                              taxFreeDaily = 150_000, employRate = 0.009, insure = false, rates = DEFAULT_RATES }) {
    const R = { ...DEFAULT_RATES, ...rates };
    const hourly = dailyWage / 8;
    const otPay = floor10(hourly * otMult * (otMin / 60));
    const nightPay = floor10(hourly * 0.5 * (nightMin / 60));      // 야간(22시~) 0.5배 가산
    const juhyuPay = floor10(hourly * (juhyuMin / 60));             // 주휴수당
    const holidayPay = floor10(hourly * 0.5 * (holidayMin / 60));   // 휴일(일요일) 0.5배 가산
    const gross = dailyWage * days + otPay + nightPay + juhyuPay + holidayPay;
    const employ = floor10(gross * employRate);
    // 4대보험 자동 적용(월 8일 이상 등 가입 요건 충족 시): 국민연금·건강보험·장기요양
    const npBase = Math.min(gross, R.npCap);
    const pension = insure ? floor10(npBase * R.pension) : 0;
    const health  = insure ? floor10(gross * R.health) : 0;
    const care    = insure ? floor10(health * R.careOfHealth) : 0;
    let perDayTax = Math.floor(Math.max(0, dailyWage - taxFreeDaily) * 0.06 * 0.45);
    if (perDayTax < 1000) perDayTax = 0;             // 일별 소액부징수
    const incomeTax = perDayTax * days;
    const localTax = floor10(perDayTax * 0.1) * days;
    const totalDeduct = employ + pension + health + care + incomeTax + localTax;
    return { gross, otPay, nightPay, juhyuPay, holidayPay, pension, health, care, employ, incomeTax, localTax, totalDeduct, net: gross - totalDeduct };
  }

  /* 야간근로(22:00~) 겹침 분 계산 — 당일 HH:MM 범위 */
  function nightOverlapMin(startHM, endHM) {
    const st = toMin(startHM), en = toMin(endHM);
    if (st == null || en == null || en <= st) return 0;
    const early = Math.max(0, Math.min(en, 6 * 60) - st);              // 새벽 00~06
    const late  = Math.max(0, Math.min(en, 24 * 60) - Math.max(st, 22 * 60)); // 22~24
    return early + late;
  }
  /* 주차 키: 해당 날짜가 속한 주의 월요일 */
  function weekKey(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return dateStr.slice(0, 4) + "-W" + pad2(d.getMonth() + 1) + pad2(d.getDate());
  }

  /* ── 근태 판정: 09:00 출근 / 18:00 퇴근 기준 ── */
  function toMin(hm) { if (!hm) return null; const [h, m] = hm.split(":").map(Number); return h * 60 + m; }
  const DEFAULT_WORK = { startMin: 9 * 60, endMin: 18 * 60, breakMin: 60 };
  function judgeAttendance(inTime, outTime, pol = DEFAULT_WORK) {
    const i = toMin(inTime), o = toMin(outTime);
    if (i == null) return { status: "결근", workMin: 0 };
    let status = i > pol.startMin ? "지각" : "정상";
    let workMin = 0;
    if (o != null) {
      workMin = Math.max(0, o - i - pol.breakMin);   // 휴게 공제
      if (o < pol.endMin && status === "정상") status = "조퇴";
      else if (o < pol.endMin && status === "지각") status = "지각·조퇴";
    } else {
      status += " (근무중)";
    }
    return { status, workMin };
  }
  const minToHM = m => `${Math.floor(m / 60)}시간 ${m % 60}분`;

  /* ── 전자결재 상태 전이 ──
     doc.line = [{userId,name,position,status:'대기'|'승인'|'반려',date,comment}] */
  function approveStep(doc, userId, action, comment = "") {
    if (doc.status !== "진행") return { ok: false, msg: "이미 종결된 문서입니다." };
    const idx = doc.line.findIndex(s => s.status === "대기");
    if (idx === -1) return { ok: false, msg: "결재할 단계가 없습니다." };
    if (doc.line[idx].userId !== userId) return { ok: false, msg: "현재 결재 순서가 아닙니다." };
    const step = doc.line[idx];
    step.date = new Date().toISOString();
    step.comment = comment;
    if (action === "approve") {
      step.status = "승인";
      if (idx === doc.line.length - 1) { doc.status = "완료"; doc.completedAt = step.date; }
      else doc.currentStep = idx + 1;
    } else if (action === "reject") {
      step.status = "반려";
      doc.status = "반려";
      doc.completedAt = step.date;
    } else return { ok: false, msg: "알 수 없는 동작입니다." };
    return { ok: true, doc };
  }

  function myTurn(doc, userId) {
    if (doc.status !== "진행") return false;
    const idx = doc.line.findIndex(s => s.status === "대기");
    return idx !== -1 && doc.line[idx].userId === userId;
  }

  return { fmtMoney, pad2, dateStr, monthStr, timeStr, calcPayroll, calcDailyPayroll, nightOverlapMin, weekKey, estimateIncomeTax,
           judgeAttendance, minToHM, approveStep, myTurn, toMin, DEFAULT_WORK, DEFAULT_RATES };
})();
globalThis.CORE = CORE;
if (typeof module !== "undefined") module.exports = CORE;
</script>

<script id="dbLayer">
"use strict";
let DB = (() => {
  const NAME = "groupwareDB", VER = 5;
  const STORES = ["users", "docs", "posts", "payroll", "attendance", "auditlog", "settings", "schedule", "notify"];
  let db = null;

  function open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("users"))      d.createObjectStore("users", { keyPath: "id" });
        if (!d.objectStoreNames.contains("docs"))       d.createObjectStore("docs", { keyPath: "docId", autoIncrement: true });
        if (!d.objectStoreNames.contains("posts"))      d.createObjectStore("posts", { keyPath: "postId", autoIncrement: true });
        if (!d.objectStoreNames.contains("payroll"))    d.createObjectStore("payroll", { keyPath: "payId", autoIncrement: true });
        if (!d.objectStoreNames.contains("attendance")) d.createObjectStore("attendance", { keyPath: "attId", autoIncrement: true });
        if (!d.objectStoreNames.contains("auditlog"))   d.createObjectStore("auditlog", { keyPath: "logId", autoIncrement: true });
        if (!d.objectStoreNames.contains("settings"))   d.createObjectStore("settings", { keyPath: "key" });
        if (!d.objectStoreNames.contains("schedule"))   d.createObjectStore("schedule", { keyPath: "schId", autoIncrement: true });
        if (!d.objectStoreNames.contains("notify"))     d.createObjectStore("notify", { keyPath: "nid", autoIncrement: true });
      };
      rq.onsuccess = e => { db = e.target.result; res(db); };
      rq.onerror = e => rej(e.target.error);
    });
  }
  const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
  const wrap = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });

  return {
    open,
    get:    (s, k) => wrap(tx(s, "readonly").get(k)),
    all:    s      => wrap(tx(s, "readonly").getAll()),
    put:    (s, v) => wrap(tx(s, "readwrite").put(v)),
    add:    (s, v) => wrap(tx(s, "readwrite").add(v)),
    del:    (s, k) => wrap(tx(s, "readwrite").delete(k)),
    count:  s      => wrap(tx(s, "readonly").count()),
  };
})();
/* ── 원격 백엔드 어댑터 (Google Apps Script) ──
   서버 URL/키가 설정되면 IndexedDB 대신 사용. 동일 인터페이스. */
const RemoteDB = (() => {
  const TTL = 12000;                       // 60명 부하 완화: 스토어별 12초 캐시
  let cache = {};                          // {store: {data, ts}}
  const cfg = () => ({ url: localStorage.getItem("gw_api_url") || "", key: localStorage.getItem("gw_api_key") || "" });
  const inval = store => { delete cache[store]; };
  async function call(body) {
    const { url, key } = cfg();
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },   // preflight 회피
      body: JSON.stringify({ key, ...body }),
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.msg || "서버 오류");
    return j.data;
  }
  return {
    isConfigured: () => !!cfg().url,
    open: async () => { const p = await call({ action: "ping" }); if (p !== "pong") throw new Error("서버 응답 이상"); return true; },
    invalidate: () => { cache = {}; },
    all: async store => {
      const c = cache[store];
      if (c && Date.now() - c.ts < TTL) return c.data;
      const data = await call({ action: "all", store });
      cache[store] = { data, ts: Date.now() };
      return data;
    },
    get: async (store, id) => call({ action: "get", store, id }),
    put: async (store, value) => { const r = await call({ action: "put", store, value }); inval(store); return r; },
    add: async (store, value) => { const r = await call({ action: "add", store, value }); inval(store); return r; },
    del: async (store, id) => { const r = await call({ action: "del", store, id }); inval(store); return r; },
    count: async store => call({ action: "count", store }),
  };
})();
let LocalDB = DB;
if (RemoteDB.isConfigured()) DB = RemoteDB;
globalThis.DB = DB;
globalThis.RemoteDB = RemoteDB;

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

  },

  boards: [{ key: "notice", name: "공지사항", write: "admin" }, { key: "free", name: "자유게시판", write: "all" }],

let CFG = JSON.parse(JSON.stringify(CFG_DEFAULTS));

    currentStep: 1, status: "완료", createdAt: now.toISOString(), completedAt: now.toISOString(), meta: {},

<script id="svcLayer">

  async function getClientIp() {
    if (globalThis.__forcedIp) return globalThis.__forcedIp;   // 테스트/사내 강제 지정용
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 3000);
      const r = await fetch("https://api.ipify.org?format=json", { signal: ctl.signal });
      clearTimeout(t);
      return (await r.json()).ip || null;
    } catch (e) { return null; }
  }
  async function checkAttendIp() {
    if (!CFG.attendIp || !CFG.attendIp.enabled) return { ok: true };
    const ip = await getClientIp();
    if (!ip) return { ok: false, msg: "접속 IP를 확인할 수 없어 출퇴근 체크가 제한됩니다." };
    const allowed = (CFG.attendIp.list || []).some(p => p && (ip === p || ip.startsWith(p)));
    return allowed ? { ok: true, ip } : { ok: false, msg: `허용되지 않은 IP(${ip})입니다. 사업장 네트워크에서 체크해주세요.` };
  }

  /* ── 근태 ── */
  async function clockIn(user, now = new Date()) {
    const ipChk = await checkAttendIp();
    if (!ipChk.ok) return ipChk;
    const date = CORE.dateStr(now);
    const dup = (await DB.all("attendance")).find(a => a.userId === user.id && a.date === date);
    if (dup) return { ok: false, msg: "이미 출근 처리되었습니다." };
    const inTime = CORE.timeStr(now);
    const j = CORE.judgeAttendance(inTime, null, workPol());
    await DB.add("attendance", { userId: user.id, userName: user.name, date, inTime, outTime: null, workMin: 0, status: j.status });
    await log(user, "출근", `${date} ${inTime}`);
    return { ok: true, inTime };
  }
  async function clockOut(user, now = new Date()) {
    const ipChk = await checkAttendIp();
    if (!ipChk.ok) return ipChk;
    const date = CORE.dateStr(now);
    const a = (await DB.all("attendance")).find(x => x.userId === user.id && x.date === date);
    if (!a) return { ok: false, msg: "출근 기록이 없습니다." };
    if (a.outTime) return { ok: false, msg: "이미 퇴근 처리되었습니다." };
    a.outTime = CORE.timeStr(now);
    const j = CORE.judgeAttendance(a.inTime, a.outTime, workPol());
    a.workMin = j.workMin; a.status = j.status;
    await DB.put("attendance", a);
    await log(user, "퇴근", `${date} ${a.outTime} (${a.status})`);
    return { ok: true, outTime: a.outTime, status: a.status };
  }

  /* ── 전자결재 ── */
  async function submitDoc({ drafter, type, title, body = "", meta = {}, lineUsers = [] }) {
    if (!title) return { ok: false, msg: "제목이 없습니다." };
    if (!lineUsers.length) return { ok: false, msg: "결재선이 없습니다." };
    const docId = await DB.add("docs", {
      type, title, body, meta,
      drafterId: drafter.id, drafterName: drafter.name, drafterDept: drafter.dept, drafterPos: drafter.position,
      line: lineUsers.map(u => ({ userId: u.id, name: u.name, position: u.position, status: "대기", date: null, comment: "" })),
      currentStep: 0, status: "진행", createdAt: new Date().toISOString(),
    });
    // 문서번호 자동 채번: 부서명-번호 (아마란스 방식)
    const nd = await DB.get("docs", docId);
    nd.docNo = `${(drafter.dept || "일반").replace(/\s/g, "")}-${1000 + Number(docId)}`;
    await DB.put("docs", nd);

    await notify(lineUsers[0].id, `🖋️ 결재 요청: [${type}] ${title}`, "approval");

  /* ── 상신 회수: 아무도 결재하지 않은 진행 문서만 기안자가 회수 가능 ── */
  async function recallDoc(docId, actor) {
    const d = await DB.get("docs", docId);
    if (!d) return { ok: false, msg: "문서를 찾을 수 없습니다." };
    if (d.drafterId !== actor.id) return { ok: false, msg: "기안자만 회수할 수 있습니다." };
    if (d.status !== "진행") return { ok: false, msg: "진행중 문서만 회수할 수 있습니다." };
    if (d.line.some(x => x.status !== "대기")) return { ok: false, msg: "이미 결재가 시작되어 회수할 수 없습니다." };
    d.status = "회수"; d.completedAt = new Date().toISOString();
    await DB.put("docs", d);
    await log(actor, "문서회수", `${d.docNo || "#" + docId} ${d.title}`);
    return { ok: true };
  }

  /* ── 연차 현황: 부여 - 승인된 연차 사용일 = 잔여 ── */
  async function leaveStatus(userId) {
    const u = await DB.get("users", userId);
    const granted = (u && u.empType !== "daily") ? (u.annualLeave ?? 15) : 0;
    const docs = (await DB.all("docs")).filter(d =>
      d.drafterId === userId && d.type.includes("휴가") && d.status === "완료" && d.meta && d.meta.kind && d.meta.from);
    let used = 0;
    for (const d of docs) {
      const m = d.meta;
      const days = Math.max(1, Math.round((new Date(m.to || m.from) - new Date(m.from)) / 86400000) + 1);
      if (m.kind.startsWith("연차")) used += days;
      else if (m.kind.startsWith("반차")) used += 0.5 * days;
      else if (m.kind.startsWith("시간차")) used += (m.hours || 0) / 8;
      // 병가/경조사 등은 연차 미차감
    }
    used = Math.round(used * 100) / 100;
    const remain = Math.round((granted - used) * 100) / 100;
    return { granted, used, remain, rate: granted ? Math.round(used / granted * 100) : 0 };
  }
  async function actOnDoc(docId, actor, action, comment = "") {
    const d = await DB.get("docs", docId);
    if (!d) return { ok: false, msg: "문서를 찾을 수 없습니다." };
    const r = CORE.approveStep(d, actor.id, action, comment);
    if (!r.ok) return r;
    await DB.put("docs", d);
    await log(actor, action === "approve" ? "결재승인" : "결재반려", `#${docId} ${d.title} → ${d.status}`);
    if (d.status === "진행") {
      const next = d.line.find(x => x.status === "대기");
      if (next) await notify(next.userId, `🖋️ 결재 요청: ${d.title}`, "approval");
    } else {
      await notify(d.drafterId, d.status === "완료" ? `✅ 결재 완료: ${d.title}` : `❌ 반려: ${d.title}`, "approval");
    }
    return { ok: true, status: d.status };
  }

  /* ── 공연/근무 스케줄 ── */
  async function addEvent({ date, title, venue = "", perfTime = "", houseOpen = "", workStart = "", workEnd = "", note = "" }, actor) {
    if (actor.role !== "admin") return { ok: false, msg: "공연 일정은 관리자만 등록할 수 있습니다." };
    if (!date || !title) return { ok: false, msg: "날짜와 공연명을 입력하세요." };
    if ((workStart && !workEnd) || (!workStart && workEnd)) return { ok: false, msg: "근무 시작·종료를 모두 입력하세요." };
    if (workStart && CORE.toMin(workEnd) <= CORE.toMin(workStart)) return { ok: false, msg: "근무 종료가 시작보다 빨라요." };
    const schId = await DB.add("schedule", { kind: "event", date, title, venue, perfTime, houseOpen, workStart, workEnd, note,
      createdBy: actor.id, createdName: actor.name, createdAt: new Date().toISOString() });
    await log(actor, "공연일정등록", `${date} ${title}${workStart ? ` 근무 ${workStart}~${workEnd}` : ""}`);
    return { ok: true, schId };
  }
  async function updateEvent(schId, fields, actor) {
    if (actor.role !== "admin") return { ok: false, msg: "관리자만 수정할 수 있습니다." };
    const e = await DB.get("schedule", schId);
    if (!e || e.kind !== "event") return { ok: false, msg: "일정을 찾을 수 없습니다." };
    for (const k of ["title", "venue", "perfTime", "houseOpen", "workStart", "workEnd", "note"]) if (fields[k] != null) e[k] = fields[k];
    if (e.workStart && e.workEnd && CORE.toMin(e.workEnd) <= CORE.toMin(e.workStart)) return { ok: false, msg: "근무 종료가 시작보다 빨라요." };
    await DB.put("schedule", e);
    await log(actor, "공연일정수정", `${e.date} ${e.title}`);
    return { ok: true };
  }
  async function deleteEvent(schId, actor) {
    const e = await DB.get("schedule", schId);
    if (!e || e.kind !== "event") return { ok: false, msg: "일정을 찾을 수 없습니다." };
    if (e.createdBy !== actor.id && actor.role !== "admin") return { ok: false, msg: "작성자 또는 관리자만 삭제할 수 있습니다." };
    await DB.del("schedule", schId);
    await log(actor, "공연일정삭제", `${e.date} ${e.title}`);
    return { ok: true };
  }
  async function requestShift({ date, startTime, endTime, note = "", eventId = null }, actor) {
    let evTitle = "";
    if (eventId) {
      // 공연 연동 근무: 시간은 관리자가 등록한 근무시간으로 강제
      const ev = await DB.get("schedule", Number(eventId));
      if (!ev || ev.kind !== "event" || ev.date !== date) return { ok: false, msg: "공연 정보를 찾을 수 없습니다." };
      if (!ev.workStart || !ev.workEnd) return { ok: false, msg: "이 공연에는 근무시간이 등록되지 않았습니다. 관리자에게 문의하세요." };
      startTime = ev.workStart; endTime = ev.workEnd; evTitle = ev.title;
    }
    if (!date || !startTime || !endTime) return { ok: false, msg: "날짜와 시간대를 입력하세요." };
    if (CORE.toMin(endTime) <= CORE.toMin(startTime)) return { ok: false, msg: "종료 시각이 시작보다 빨라요." };
    const dup = (await DB.all("schedule")).find(x => x.kind === "shift" && x.userId === actor.id && x.date === date);
    if (dup) return { ok: false, msg: "해당 일자에 이미 근무 신청이 있습니다." };
    const schId = await DB.add("schedule", { kind: "shift", date, userId: actor.id, userName: actor.name, empType: actor.empType || "regular",
      startTime, endTime, note, eventId: eventId ? Number(eventId) : null, eventTitle: evTitle, status: "신청", createdAt: new Date().toISOString() });
    await log(actor, "근무신청", `${date} ${startTime}~${endTime}${evTitle ? ` (${evTitle})` : ""}`);
    return { ok: true, schId };
  }
  async function updateShift(schId, { startTime, endTime, status, note }, actor) {
    const sh = await DB.get("schedule", schId);
    if (!sh || sh.kind !== "shift") return { ok: false, msg: "근무 신청을 찾을 수 없습니다." };
    const isAdmin = actor.role === "admin";
    if (!isAdmin && sh.userId !== actor.id) return { ok: false, msg: "본인 신청만 수정할 수 있습니다." };
    if (!isAdmin && sh.status === "확정") return { ok: false, msg: "확정된 근무는 관리자만 변경할 수 있습니다." };
    if (status && !isAdmin) return { ok: false, msg: "확정 처리는 관리자만 가능합니다." };
    if (startTime) sh.startTime = startTime;
    if (endTime) sh.endTime = endTime;
    if (note != null) sh.note = note;
    if (status) sh.status = status;
    if (sh.startTime && sh.endTime && CORE.toMin(sh.endTime) <= CORE.toMin(sh.startTime)) return { ok: false, msg: "종료 시각이 시작보다 빨라요." };
    await DB.put("schedule", sh);
    await log(actor, status ? "근무" + status : "근무수정", `${sh.userName} ${sh.date} ${sh.startTime}~${sh.endTime}`);
    if (status === "확정") await notify(sh.userId, `🗓️ 근무 확정: ${sh.date} ${sh.startTime}~${sh.endTime}`, "schedule");
    if (status === "신청") await notify(sh.userId, `🗓️ 근무 확정 해제: ${sh.date}`, "schedule");
    return { ok: true, status: sh.status };
  }
  async function deleteShift(schId, actor) {
    const sh = await DB.get("schedule", schId);
    if (!sh || sh.kind !== "shift") return { ok: false, msg: "근무 신청을 찾을 수 없습니다." };
    const isAdmin = actor.role === "admin";
    if (!isAdmin && (sh.userId !== actor.id || sh.status === "확정")) return { ok: false, msg: "확정 근무 삭제는 관리자만 가능합니다." };
    await DB.del("schedule", schId);
    await log(actor, "근무삭제", `${sh.userName} ${sh.date}`);
    return { ok: true };
  }
  /* 확정 스케줄 → 월 근무 집계 (급여 산정 기준 = schedule일 때 사용) */
  async function monthSchedule(userId, ym) {
    const std = stdDayMin();
    const brk = Number(CFG.work.breakMin) || 60;
    const rows = (await DB.all("schedule")).filter(x => x.kind === "shift" && x.userId === userId && x.status === "확정" && x.date.startsWith(ym));
    const weekMin = {};
    let otMin = 0, totalMin = 0, nightMin = 0, holidayMin = 0;
    const details = [];
    for (const r of rows) {
      const wm = Math.max(0, CORE.toMin(r.endTime) - CORE.toMin(r.startTime) - brk);
      totalMin += wm; otMin += Math.max(0, wm - std);
      nightMin += CORE.nightOverlapMin(r.startTime, r.endTime);
      if (isSunday(r.date)) holidayMin += wm;
      weekMin[CORE.weekKey(r.date)] = (weekMin[CORE.weekKey(r.date)] || 0) + wm;
      details.push({ date: r.date, s: r.startTime, e: r.endTime, min: wm, label: r.eventTitle || "일반 근무" });
    }
    details.sort((x, y) => x.date.localeCompare(y.date));
    return { workDays: rows.length, otMin, lateN: 0, totalMin, nightMin, holidayMin, juhyuMin: juhyuFromWeeks(weekMin), details };
  }

  /* ── 근태 → 급여 자동 계산 ── */
  function juhyuFromWeeks(weekMin) {
    // 주 15시간(900분) 이상 근무한 주: (주간근로 ÷ 40h) × 8h, 최대 8h
    let m = 0;
    for (const wk in weekMin) if (weekMin[wk] >= 900) m += Math.min(480, Math.round(weekMin[wk] * 0.2));
    return m;
  }
  const isSunday = ds => new Date(ds + "T00:00:00").getDay() === 0;
  async function monthAttendance(userId, ym) {
    const rows = (await DB.all("attendance")).filter(a => a.userId === userId && a.date.startsWith(ym) && a.outTime);
    const std = stdDayMin();
    const weekMin = {};
    let otMin = 0, totalMin = 0, nightMin = 0, holidayMin = 0;
    const details = [];
    for (const a of rows) {
      const wm = a.workMin || 0;
      otMin += Math.max(0, wm - std); totalMin += wm;
      nightMin += CORE.nightOverlapMin(a.inTime, a.outTime);
      if (isSunday(a.date)) holidayMin += wm;
      weekMin[CORE.weekKey(a.date)] = (weekMin[CORE.weekKey(a.date)] || 0) + wm;
      details.push({ date: a.date, s: a.inTime, e: a.outTime, min: wm, label: "출퇴근 체크" });
    }
    details.sort((x, y) => x.date.localeCompare(y.date));
    const lateN = rows.filter(a => a.status.startsWith("지각")).length;
    return { workDays: rows.length, otMin, lateN, totalMin, nightMin, holidayMin, juhyuMin: juhyuFromWeeks(weekMin), details };
  }
  const overtimePay = (salaryBase, otMin) => floor10(salaryBase / Number(CFG.pay.monthHours) * Number(CFG.pay.otMult) * (otMin / 60));

  async function runMonthlyPayroll(ym, { allowance = 200000, actor = null } = {}) {
    const users = await DB.all("users");
    const existing = await DB.all("payroll");
    const results = [];
    const useSchedule = CFG.payBasis === "schedule";
    for (const u of users) {
      if (existing.find(p => p.userId === u.id && p.ym === ym && (p.kind || "salary") === "salary")) {
        results.push({ userId: u.id, name: u.name, skipped: true }); continue;
      }
      const att = useSchedule ? await monthSchedule(u.id, ym) : await monthAttendance(u.id, ym);
      // 사용자 정의 급여 항목 (관리자 설정)
      const empT = u.empType || "regular";
      const itms = (CFG.payItems || []).filter(it => it.target === "all" || it.target === empT);
      const aTax  = itms.filter(it => it.type === "수당(과세)").reduce((t, it) => t + Number(it.amount || 0), 0);
      const aFree = itms.filter(it => it.type === "수당(비과세)").reduce((t, it) => t + Number(it.amount || 0), 0);
      const iDed  = itms.filter(it => it.type === "공제").reduce((t, it) => t + Number(it.amount || 0), 0);
      const itemNote = itms.map(it => `${it.name} ${it.type === "공제" ? "-" : "+"}${CORE.fmtMoney(it.amount)}`).join(", ");
      let rec;
      if ((u.empType || "regular") === "daily") {
        const Dc = CFG.daily;
        const otM = Dc.otOn === false ? 0 : att.otMin;
        const ntM = Dc.nightOn === false ? 0 : (att.nightMin || 0);
        const jhM = Dc.juhyuOn === false ? 0 : (att.juhyuMin || 0);
        const hdM = Dc.holidayOn === false ? 0 : (att.holidayMin || 0);
        const insure = Dc.autoInsure !== false && att.workDays >= Number(Dc.insureMinDays ?? 8);
        const calc = CORE.calcDailyPayroll({ dailyWage: u.dailyWage || 0, days: att.workDays, otMin: otM,
          nightMin: ntM, juhyuMin: jhM, holidayMin: hdM, insure, rates: payRates(),
          otMult: Number(CFG.pay.otMult), taxFreeDaily: Number(Dc.taxFree), employRate: Dc.employPct / 100 });
        const gross = calc.gross + aTax + aFree;
        const totalDeduct = calc.totalDeduct + iDed;
        rec = { kind: "salary", empType: "daily", userId: u.id, userName: u.name, ym,
          base: (u.dailyWage || 0) * att.workDays, dailyWage: u.dailyWage || 0, allowance: 0, overtime: calc.otPay,
          nightMin: ntM, nightPay: calc.nightPay, juhyuMin: jhM, juhyuPay: calc.juhyuPay,
          holidayMin: hdM, holidayPay: calc.holidayPay, insured: insure,
          details: att.details || [],
          itemAllow: aTax + aFree, itemDeduct: iDed, itemNote,
          otMin: otM, lateN: att.lateN, workDays: att.workDays, basis: useSchedule ? "schedule" : "attendance",
          gross, pension: calc.pension, health: calc.health, care: calc.care, employ: calc.employ,
          incomeTax: calc.incomeTax, localTax: calc.localTax, totalDeduct, net: gross - totalDeduct };
      } else {
        const overtime = overtimePay(u.salaryBase, att.otMin);
        const calc = CORE.calcPayroll({ base: u.salaryBase, allowance: allowance + aTax + aFree, overtime,
          mealTaxFree: Number(CFG.pay.mealTaxFree) + aFree, rates: payRates() });
        calc.totalDeduct += iDed; calc.net -= iDed;
        rec = { kind: "salary", empType: "regular", userId: u.id, userName: u.name, ym,
          base: u.salaryBase, allowance, overtime, itemAllow: aTax + aFree, itemDeduct: iDed, itemNote,
          otMin: att.otMin, lateN: att.lateN, workDays: att.workDays, basis: useSchedule ? "schedule" : "attendance", ...calc };
      }
      await DB.add("payroll", { ...rec, issued: true, issuedAt: new Date().toISOString(), createdAt: new Date().toISOString() });
      await notify(u.id, `💰 ${ym} 급여명세서가 발급되었습니다`, "pay");
      results.push({ userId: u.id, name: u.name, empType: rec.empType, otMin: att.otMin, overtime: rec.overtime, net: rec.net });
    }
    await log(actor, "급여일괄계산", `${ym} · ${results.filter(r => !r.skipped).length}건 발급`);
    return results;
  }
  async function grantBonus(ym, entries, { label = "성과급", actor = null } = {}) {
    const existing = await DB.all("payroll");
    const results = [];
    for (const { userId, amount } of entries) {
      const u = await DB.get("users", userId);
      if (!u || !(amount > 0)) continue;
      if (existing.find(p => p.userId === userId && p.ym === ym && p.kind === "bonus")) {
        results.push({ userId, skipped: true }); continue;
      }
      const calc = CORE.calcPayroll({ base: amount, allowance: 0, overtime: 0, mealTaxFree: 0 });
      await DB.add("payroll", {
        kind: "bonus", label, userId, userName: u.name, ym, base: amount, allowance: 0, overtime: 0,
        ...calc, issued: true, issuedAt: new Date().toISOString(), createdAt: new Date().toISOString(),
      });
      await notify(userId, `🎁 ${ym} ${label} 명세서가 발급되었습니다`, "pay");
      results.push({ userId, name: u.name, net: calc.net });
    }
    await log(actor, "성과급지급", `${ym} · ${results.filter(r => !r.skipped).length}건`);
    return results;
  }

  /* ── 감사 리포트 ── */
  async function buildAudit(ymFrom, ymTo) {
    const inRange = ym => ym >= ymFrom && ym <= ymTo;
    const docs = (await DB.all("docs")).filter(d => inRange(d.createdAt.slice(0, 7)));
    const atts = (await DB.all("attendance")).filter(a => inRange(a.date.slice(0, 7)));
    const pays = (await DB.all("payroll")).filter(p => inRange(p.ym));
    const violations = [];

    const done = docs.filter(d => d.status === "완료");
    const avgDays = done.length ? done.reduce((t, d) => t + Math.max(0, (new Date(d.completedAt) - new Date(d.createdAt)) / 86400000), 0) / done.length : 0;
    for (const d of docs) {
      if (d.status === "완료" && !d.line.every(x => x.status === "승인")) violations.push(`문서#${d.docId} 완료 상태이나 미승인 단계 존재`);
      if (d.status === "반려" && !d.line.some(x => x.status === "반려")) violations.push(`문서#${d.docId} 반려 상태이나 반려 단계 없음`);
      if (d.status === "진행" && !d.line.some(x => x.status === "대기")) violations.push(`문서#${d.docId} 진행 상태이나 대기 단계 없음`);
    }
    const seen = new Set();
    for (const p of pays) {
      if (p.net !== p.gross - p.totalDeduct) violations.push(`급여#${p.payId} 실수령 산식 불일치`);
      const key = `${p.userId}|${p.ym}|${p.kind || "salary"}`;
      if (seen.has(key)) violations.push(`급여 중복 등록: ${key}`);
      seen.add(key);
    }
    const lateN = atts.filter(a => a.status.startsWith("지각")).length;
    const pendingDocs = docs.filter(d => d.status === "진행");
    const stalePending = pendingDocs.filter(d => (new Date() - new Date(d.createdAt)) / 86400000 > 3).length;
    return {
      period: `${ymFrom} ~ ${ymTo}`,
      docs: { total: docs.length, done: done.length, rejected: docs.filter(d => d.status === "반려").length,
              recalled: docs.filter(d => d.status === "회수").length,
              pending: pendingDocs.length, stalePending,
              avgApprovalDays: Math.round(avgDays * 10) / 10 },
      attendance: { records: atts.length, lateN,
                    lateRate: atts.length ? Math.round(lateN / atts.length * 1000) / 10 : 0,
                    totalHours: Math.round(atts.reduce((t, a) => t + (a.workMin || 0), 0) / 60) },
      payroll: { count: pays.length,
                 gross: pays.reduce((t, p) => t + p.gross, 0),
                 deduct: pays.reduce((t, p) => t + p.totalDeduct, 0),
                 net: pays.reduce((t, p) => t + p.net, 0),
                 bonusCount: pays.filter(p => p.kind === "bonus").length,
                 issued: pays.filter(p => p.issued).length },
      violations,
    };
  }

  /* ── 관리자: 근태 수정/추가/삭제 ── */
  async function upsertAttendance({ attId = null, userId, date, inTime, outTime }, actor) {
    const u = await DB.get("users", userId);
    if (!u || !date || !inTime) return { ok: false, msg: "사원·날짜·출근시각은 필수입니다." };
    const all = await DB.all("attendance");
    const dup = all.find(a => a.userId === userId && a.date === date && a.attId !== attId);
    if (dup) return { ok: false, msg: "해당 일자 기록이 이미 있습니다." };
    const j = CORE.judgeAttendance(inTime, outTime || null, workPol());
    const rec = { userId, userName: u.name, date, inTime, outTime: outTime || null, workMin: j.workMin, status: j.status };
    if (attId != null) { rec.attId = attId; await DB.put("attendance", rec); }
    else await DB.add("attendance", rec);
    await log(actor, attId != null ? "근태수정" : "근태추가", `${u.name} ${date} ${inTime}~${outTime || "-"}`);
    return { ok: true, status: j.status };
  }
  async function deleteAttendance(attId, actor) {
    const a = await DB.get("attendance", attId);
    await DB.del("attendance", attId);
    await log(actor, "근태삭제", a ? `${a.userName} ${a.date}` : `#${attId}`);
    return { ok: true };
  }

  /* ── 관리자: 결재문서 수정/삭제 ── */
  async function editDoc(docId, { title, body }, actor) {
    const d = await DB.get("docs", docId);
    if (!d) return { ok: false, msg: "문서를 찾을 수 없습니다." };
    if (title) d.title = title;
    if (body != null) d.body = body;
    d.editedAt = new Date().toISOString(); d.editedBy = actor?.name;
    await DB.put("docs", d);
    await log(actor, "문서수정", `#${docId} ${d.title}`);
    return { ok: true };
  }
  async function deleteDoc(docId, actor) {
    const d = await DB.get("docs", docId);
    await DB.del("docs", docId);
    await log(actor, "문서삭제", d ? `#${docId} [${d.type}] ${d.title}` : `#${docId}`);
    return { ok: true };
  }

  /* ── 전자서명 등록 및 명세서 2단계 확인 ── */
  async function setSignature(user, sign) {
    if (!sign) return { ok: false, msg: "서명이 비어 있습니다." };
    const u = await DB.get("users", user.id);
    u.signature = sign;
    await DB.put("users", u);
    await log(user, "서명등록");
    return { ok: true };
  }
  async function confirmSlip(payId, step, actor) {   // step: 'work' | 'final'
    const p = await DB.get("payroll", payId);
    if (!p) return { ok: false, msg: "명세서를 찾을 수 없습니다." };
    if (p.userId !== actor.id) return { ok: false, msg: "본인 명세서만 확인할 수 있습니다." };
    const u = await DB.get("users", actor.id);
    if (!u.signature) return { ok: false, msg: "먼저 서명을 등록하세요." };
    if (step === "work") {
      if (p.workConfirmedAt) return { ok: false, msg: "이미 근무 확인이 완료되었습니다." };
      p.workSign = u.signature; p.workConfirmedAt = new Date().toISOString();
    } else if (step === "final") {
      if (!p.workConfirmedAt) return { ok: false, msg: "근무 확인을 먼저 진행하세요." };
      if (p.finalConfirmedAt) return { ok: false, msg: "이미 최종 확인이 완료되었습니다." };
      p.finalSign = u.signature; p.finalConfirmedAt = new Date().toISOString();
    } else return { ok: false, msg: "알 수 없는 단계입니다." };
    await DB.put("payroll", p);
    await log(actor, step === "work" ? "근무확인서명" : "급여최종확인", `${p.ym} ${p.userName}`);
    return { ok: true };
  }

  /* ── 공연 엑셀/CSV 일괄 등록 ── */
  async function bulkAddEvents(rows, actor) {
    if (actor.role !== "admin") return { ok: false, msg: "관리자 전용 기능입니다." };
    let added = 0; const errors = [];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (!r.date || !/^\d{4}-\d{2}-\d{2}$/.test(String(r.date).trim())) { errors.push(`${i + 2}행: 날짜 형식(YYYY-MM-DD) 오류`); continue; }
      const res = await addEvent({ date: String(r.date).trim(), title: r.title || "", venue: r.venue || "", perfTime: r.perfTime || "",
        houseOpen: r.houseOpen || "", workStart: r.workStart || "", workEnd: r.workEnd || "", note: r.note || "" }, actor);
      if (res.ok) added++; else errors.push(`${i + 2}행: ${res.msg}`);
    }
    await log(actor, "공연일괄등록", `${added}건 성공, ${errors.length}건 실패`);
    return { ok: true, added, errors };
  }

  /* ── 셀프 회원가입 (급여 지급·신고 필수정보) → 관리자 승인 ── */
  async function signUp(form) {
    const req = ["name", "pwHash", "rrn", "phone", "bank", "account"];
    for (const k of req) if (!form[k]) return { ok: false, msg: "급여 지급·신고에 필요한 필수 정보를 모두 입력하세요." };
    if (!/^\d{6}-?\d{7}$/.test(form.rrn)) return { ok: false, msg: "주민등록번호 형식을 확인하세요 (000000-0000000)." };
    const dup = (await DB.all("users")).find(x => x.status === "pending" && x.rrn === form.rrn);
    if (dup) return { ok: false, msg: "이미 접수된 가입 신청이 있습니다. 관리자 승인을 기다려주세요." };
    const tempId = "P" + Date.now();   // 사번은 관리자 승인 시 발급
    const u = { ...form, id: tempId, role: "user", status: "pending", empType: form.empType || "regular",
      salaryBase: 0, dailyWage: 0, annualLeave: 0, appliedAt: new Date().toISOString() };
    await DB.put("users", u);
    await log(u, "가입신청", `${u.name} (${u.dept || "-"})`);
    const admins = (await DB.all("users")).filter(x => x.role === "admin" && x.status !== "pending");
    await notify(admins.map(a => a.id), `👤 가입 승인 요청: ${u.name} (${u.dept || "-"} ${u.position || ""})`, "admin");
    return { ok: true, tempId };
  }
  /* 승인: 관리자가 사번 발급 + 급여 조건 지정 / 거절: 신청 삭제 */
  async function approveUser(tempId, approve, actor, opts = {}) {
    const u = await DB.get("users", tempId);
    if (!u || u.status !== "pending") return { ok: false, msg: "승인 대기 사원이 아닙니다." };
    if (!approve) {
      await DB.del("users", tempId);
      await log(actor, "가입거절", `${u.name}`);
      return { ok: true };
    }
    const newId = String(opts.newId || "").trim();
    if (!newId) return { ok: false, msg: "발급할 사번을 입력하세요." };
    if (await DB.get("users", newId)) return { ok: false, msg: "이미 사용 중인 사번입니다." };
    const fin = { ...u, id: newId, status: "active",
      salaryBase: Number(opts.salaryBase) || 0, dailyWage: Number(opts.dailyWage) || 0,
      annualLeave: u.empType === "daily" ? 0 : (Number(opts.annualLeave) || 15),
      joinDate: CORE.dateStr(new Date()), approvedBy: actor.name, approvedAt: new Date().toISOString() };
    await DB.put("users", fin);
    await DB.del("users", tempId);
    await notify(newId, `🎉 가입 승인 완료! 사번 ${newId}로 로그인하세요.`, "home");
    await log(actor, "가입승인", `${fin.name} → 사번 ${newId} 발급`);
    return { ok: true, newId };
  }
  async function nextEmpId() {
    const ids = (await DB.all("users")).map(x => parseInt(x.id, 10)).filter(n => !isNaN(n));
    return String(ids.length ? Math.max(...ids) + 1 : 1001);
  }

  return { clockIn, clockOut, checkAttendIp, getClientIp, submitDoc, actOnDoc, recallDoc, leaveStatus, signUp, approveUser, notify,
           setSignature, confirmSlip, bulkAddEvents, nextEmpId,
           addEvent, updateEvent, deleteEvent, requestShift, updateShift, deleteShift, monthSchedule, monthAttendance, overtimePay,
           runMonthlyPayroll, grantBonus, buildAudit, log, stdDayMin,
           upsertAttendance, deleteAttendance, editDoc, deleteDoc };
})();
globalThis.SVC = SVC;
</script>

<!-- ══════════ 앱 로직 ══════════ -->
<script id="appLogic">
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const F = CORE.fmtMoney;
/* 휴가 meta → 연차 차감일수 (연차 1일, 반차 0.5일, 시간차 h/8일 · 병가/경조사 0) */
function leaveDaysOf(meta) {
  if (!meta || !meta.kind) return 0;
  const days = Math.max(1, Math.round((new Date(meta.to || meta.from) - new Date(meta.from)) / 86400000) + 1);
  if (meta.kind.startsWith("연차")) return days;
  if (meta.kind.startsWith("반차")) return 0.5 * days;
  if (meta.kind.startsWith("시간차")) return Math.round((meta.hours || 0) / 8 * 100) / 100;
  return 0;
}
globalThis.leaveDaysOf = leaveDaysOf;
let ME = null;               // 로그인 사용자
let USERS = [];              // 사용자 캐시

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
function openModal(html) {
  $("#modalRoot").innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#modalBg").addEventListener("click", e => { if (e.target.id === "modalBg") closeModal(); });
}
function closeModal() { $("#modalRoot").innerHTML = ""; }
const fmtDate = iso => { const d = new Date(iso); return `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, "0")} ${CORE.timeStr(d)}`; };
const statusPill = s => s === "완료" || s === "승인" ? `<span class="pill ok">${s}</span>`
  : s === "반려" ? `<span class="pill no">${s}</span>`
  : s === "진행" ? `<span class="pill ing">진행중</span>`
  : s === "회수" ? `<span class="pill" style="background:#EEF0F3;color:#7A828E">회수</span>`
  : `<span class="pill wait">${esc(s)}</span>`;

/* ── 인증 ── */
async function doLogin() {
  const id = $("#loginId").value.trim(), pw = $("#loginPw").value;
  const err = $("#loginErr");
  err.classList.add("hidden");
  if (!id || !pw) { err.textContent = "사번과 비밀번호를 입력하세요."; err.classList.remove("hidden"); return; }
  const u = await DB.get("users", id);
  if (!u || u.pwHash !== await sha256(pw)) {
    err.textContent = "사번 또는 비밀번호가 올바르지 않습니다."; err.classList.remove("hidden"); return;
  }
  if (u.status === "pending") {
    err.textContent = "가입 승인 대기 중입니다. 관리자 승인 후 로그인할 수 있습니다."; err.classList.remove("hidden"); return;
  }
  ME = u;
  SVC.log(u, "로그인");
  sessionStorage.setItem("gw_uid", u.id);
  await enterApp();
}
async function enterApp() {
  USERS = await DB.all("users");
  $("#loginView").classList.add("hidden");
  $("#appView").classList.remove("hidden");
  $("#topName").textContent = `${ME.name} ${ME.position}`;
  $("#topAvatar").textContent = ME.name[0];
  $("#navAdmin").classList.toggle("hidden", ME.role !== "admin");
  $("#modeBadge").textContent = DB === RemoteDB ? "🌐 서버" : "💾 로컬";
  go("home");
}
function doLogout() {
  sessionStorage.removeItem("gw_uid");
  ME = null;
  $("#appView").classList.add("hidden");
  $("#loginView").classList.remove("hidden");
  $("#loginPw").value = "";
}

/* ── 회원가입 ── */
function openSignup() {
  const sd = CFG.signup || {};
  const selOrInput = (id, list, ph) => (list && list.length)
    ? `<select id="${id}">${list.map(v => `<option>${esc(v)}</option>`).join("")}</select>`

  openModal(`
    <h3>회원가입</h3>
    <div style="font-size:12.5px;color:var(--sub);margin-top:4px">급여 지급 및 4대보험·세무 신고에 필요한 정보입니다.<br><b>사번은 관리자 승인 시 발급됩니다.</b></div>
    ${sd.notice ? `<div style="font-size:12.5px;background:var(--navy-t);color:var(--navy);border-radius:8px;padding:9px 11px;margin-top:8px;white-space:pre-wrap">${esc(sd.notice)}</div>` : ""}
    <label>이름 *</label><input id="suName">
    <div class="row2">
      <div><label>비밀번호 *</label><input id="suPw" type="password"></div>
      <div><label>비밀번호 확인 *</label><input id="suPw2" type="password"></div>
    </div>
    <div class="row2">
      <div><label>부서(팀) *</label>${selOrInput("suDept", sd.depts, "예: 하우스팀")}</div>
      <div><label>직급 *</label>${selOrInput("suPos", sd.positions, "예: 어셔")}</div>
    </div>
    <label>고용형태</label>
    <select id="suType"><option value="daily">일용직(일당)</option><option value="regular">정규직(월급)</option></select>
    <label>주민등록번호 * <span style="font-weight:400">(원천징수·4대보험 신고용)</span></label>
    <input id="suRrn" placeholder="000000-0000000" inputmode="numeric">
    <label>연락처 *</label><input id="suPhone" placeholder="010-0000-0000" inputmode="tel">
    <label>이메일</label><input id="suEmail" type="email" placeholder="선택">
    <div class="row2">
      <div><label>급여 입금 은행 *</label><input id="suBank" placeholder="예: 국민은행"></div>
      <div><label>계좌번호 *</label><input id="suAcct" inputmode="numeric"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn ghost" id="suCancel">취소</button>
      <button class="btn" id="suSubmit">가입 신청</button>
    </div>`);
  $("#suCancel").onclick = closeModal;
  $("#suSubmit").onclick = async () => {
    if (!$("#suPw").value || $("#suPw").value !== $("#suPw2").value) return toast("비밀번호가 일치하지 않습니다");
    const r = await SVC.signUp({
      name: $("#suName").value.trim(), pwHash: await sha256($("#suPw").value),
      dept: $("#suDept").value.trim(), position: $("#suPos").value.trim(), empType: $("#suType").value,
      rrn: $("#suRrn").value.trim(), phone: $("#suPhone").value.trim(), email: $("#suEmail").value.trim(),
      bank: $("#suBank").value.trim(), account: $("#suAcct").value.trim(),
    });
    if (!r.ok) return toast(r.msg);
    closeModal();
    toast("가입 신청 완료! 관리자 승인 후 발급된 사번으로 로그인하세요.");
  };
}

/* ── 라우팅 ── */
const TITLES = { home: "홈", approval: "전자결재", schedule: "근무 스케줄", board: "게시판", attend: "근태관리", pay: "급여", admin: "관리자" };
async function go(view, param) {
  $$(".nav-item[data-view],.tab[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  $$("section[id^=view-]").forEach(s => s.classList.add("hidden"));
  $(`#view-${view}`).classList.remove("hidden");
  $("#topTitle").textContent = TITLES[view] || "";
  window.scrollTo(0, 0);
  if (view === "home") await renderHome();
  if (view === "approval") await renderApproval(param);
  if (view === "schedule") await renderSchedule();
  if (view === "board") await renderBoard(param);
  if (view === "attend") await renderAttend();
  if (view === "pay") await renderPay();
  if (view === "admin") await renderAdmin();
  await refreshBadge();
}
async function refreshBadge() {
  const docs = await DB.all("docs");
  const n = docs.filter(d => CORE.myTurn(d, ME.id)).length;
  $("#badgeAppr").textContent = n;
  $("#badgeAppr").classList.toggle("hidden", n === 0);
  $("#tabDotAppr").classList.toggle("hidden", n === 0);

  $("#bellBadge").textContent = un > 99 ? "99+" : un;
  $("#bellBadge").classList.toggle("hidden", un === 0);
}
async function openNotify() {
  const list = (await DB.all("notify")).filter(x => x.userId === ME.id).sort((a, b) => b.ts.localeCompare(a.ts)).slice(0, 40);
  openModal(`
    <div class="card-head"><h3>🔔 알림</h3>${list.some(x => !x.read) ? `<button class="btn small ghost" id="ntAll">모두 읽음</button>` : ""}</div>
    ${list.length ? list.map(x => `
      <button class="list-row" data-nt="${x.nid}" data-view="${esc(x.view)}" style="${x.read ? "opacity:.55" : ""}">
        <div class="grow"><div class="t" style="font-weight:${x.read ? 500 : 700}">${esc(x.text)}</div><div class="s">${fmtDate(x.ts)}</div></div>
        ${x.read ? "" : `<span class="dot" style="width:8px;height:8px;border-radius:50%;background:var(--stamp);flex:none"></span>`}
      </button>`).join("") : `<div class="empty">알림이 없습니다.</div>`}
    <button class="btn ghost" id="ntClose" style="margin-top:10px">닫기</button>`);
  $("#ntClose").onclick = closeModal;
  const all = $("#ntAll");
  if (all) all.onclick = async () => {
    for (const x of list.filter(y => !y.read)) { x.read = true; await DB.put("notify", x); }
    closeModal(); refreshBadge(); toast("모두 읽음 처리했습니다");
  };
  $("#modalRoot").querySelectorAll("[data-nt]").forEach(b => b.onclick = async () => {
    const x = await DB.get("notify", Number(b.dataset.nt));
    if (x && !x.read) { x.read = true; await DB.put("notify", x); }
    closeModal(); go(b.dataset.view || "home");
  });
}

/* ── 홈 ── */

  const today = CORE.dateStr(new Date());
  const myAtt = atts.find(a => a.userId === ME.id && a.date === today);
