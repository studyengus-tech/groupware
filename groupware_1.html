  const notices = posts.filter(p => p.board === "notice").sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 3);
  const attState = !myAtt ? "출근 전" : myAtt.outTime ? `퇴근 완료 (${myAtt.inTime}~${myAtt.outTime})` : `근무중 · ${myAtt.inTime} 출근`;

  $("#view-home").innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="k">결재 대기</div><div class="v">${waitN}<small>건</small></div></div>
      <div class="stat"><div class="k">내 상신 진행중</div><div class="v">${myIngN}<small>건</small></div></div>
      <div class="stat"><div class="k">오늘 근태</div><div class="v" style="font-size:15px;padding-top:6px">${esc(attState)}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>빠른 작업</h3></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small" data-go="approval" data-p="write">🖋️ 기안 작성</button>
        <button class="btn small ghost" data-go="attend">⏰ 출퇴근 체크</button>
        <button class="btn small ghost" data-go="approval" data-p="req">🏖️ 휴가/근무 신청</button>
        ${ME.role === "admin" ? `<button class="btn small ghost" data-go="admin">⚙️ 사원·급여 관리</button>` : ""}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📢 공지사항</h3><button class="more" data-go="board">더보기 ›</button></div>
      ${notices.length ? notices.map(p => `
        <button class="list-row" data-post="${p.postId}">
          <div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${esc(p.authorName)} · ${fmtDate(p.createdAt)}</div></div>
        </button>`).join("") : `<div class="empty">등록된 공지가 없습니다.</div>`}
    </div>`;
  $("#view-home").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go, b.dataset.p));
  $("#view-home").querySelectorAll("[data-post]").forEach(b => b.onclick = () => go("board", { open: Number(b.dataset.post) }));
}

/* ── 전자결재 ── */
const DOC_TYPES = () => (CFG.docTypes || []).map(t => t.name);
const docTemplate = name => (CFG.docTypes || []).find(t => t.name === name)?.template || "";
let apprTab = "todo";
async function renderApproval(param) {
  if (param === "write") { renderApprList(); openDocWrite(); return; }
  if (param === "req") { renderApprList(); openDocWrite("휴가신청"); return; }
  if (param && param.open) { renderApprList().then(() => openDocDetail(param.open)); return; }
  await renderApprList();
}
async function renderApprList() {
  const docs = (await DB.all("docs")).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const lists = {
    todo: docs.filter(d => CORE.myTurn(d, ME.id)),
    mine: docs.filter(d => d.drafterId === ME.id),
    done: docs.filter(d => d.line.some(s => s.userId === ME.id && s.status !== "대기")),
    all:  ME.role === "admin" ? docs : null,
  };
  const cur = lists[apprTab] || [];
  $("#view-approval").innerHTML = `
    <div class="toolbar">
      <div class="seg" style="margin:0;flex:1">
        <button data-t="todo" class="${apprTab === "todo" ? "active" : ""}">결재대기 ${lists.todo.length ? `(${lists.todo.length})` : ""}</button>
        <button data-t="mine" class="${apprTab === "mine" ? "active" : ""}">기안함</button>
        <button data-t="done" class="${apprTab === "done" ? "active" : ""}">결재이력</button>
        ${ME.role === "admin" ? `<button data-t="all" class="${apprTab === "all" ? "active" : ""}">전체</button>` : ""}
      </div>
      <button class="btn small" id="btnDocWrite">＋ 기안</button>
    </div>
    <div class="card" style="padding:6px 14px">
      ${cur.length ? cur.map(d => `
        <button class="list-row" data-doc="${d.docId}">
          <div class="grow">
            <div class="t">[${esc(d.type)}] ${esc(d.title)}</div>
            <div class="s">${d.docNo ? esc(d.docNo) + " · " : ""}${esc(d.drafterName)} ${esc(d.drafterPos || "")} · ${fmtDate(d.createdAt)}</div>
          </div>
          ${statusPill(d.status)}
        </button>`).join("") : `<div class="empty">문서가 없습니다.</div>`}
    </div>`;
  $("#view-approval").querySelectorAll(".seg button").forEach(b => b.onclick = () => { apprTab = b.dataset.t; renderApprList(); });
  $("#btnDocWrite").onclick = () => openDocWrite();
  $("#view-approval").querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDocDetail(Number(b.dataset.doc)));
}

async function openDocWrite(presetType) {
  let line = [];
  const others = USERS.filter(u => u.id !== ME.id);
  const savedRow = await DB.get("settings", `lines_${ME.id}`).catch(() => null);
  const savedLines = (savedRow && savedRow.value) || [];
  const leave = await SVC.leaveStatus(ME.id);
  openModal(`
    <h3>기안 작성</h3>
    <label>문서 종류</label>
    <select id="dwType">${DOC_TYPES().map(t => `<option ${t === presetType ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
    <div id="dwLeave" class="hidden" style="font-size:12.5px;color:var(--navy);background:var(--navy-t);border-radius:8px;padding:8px 10px;margin-top:8px">
      내 연차: 부여 ${leave.granted}일 · 사용 ${leave.used}일 · <b>잔여 ${leave.remain}일</b> (사용률 ${leave.rate}%)</div>
    <div id="dwExtra"></div>
    <label>제목</label><input id="dwTitle" placeholder="문서 제목">
    <label>내용</label><textarea id="dwBody" rows="5" placeholder="기안 내용을 입력하세요"></textarea>
    <label>결재선 (순서대로 추가)</label>
    ${savedLines.length ? `<select id="dwSaved" style="margin-bottom:6px"><option value="">💾 저장된 결재선 불러오기…</option>${savedLines.map((l, i) => `<option value="${i}">${esc(l.name)} (${l.userIds.length}단계)</option>`).join("")}</select>` : ""}
    <select id="dwPick"><option value="">결재자 선택…</option>${others.map(u => `<option value="${u.id}">${esc(u.name)} ${esc(u.position)} · ${esc(u.dept)}</option>`).join("")}</select>
    <div class="appr-picked" id="dwLine"></div>
    <button class="btn small ghost" id="dwSaveLine" style="margin-top:8px">현재 결재선 저장</button>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn ghost" id="dwCancel">취소</button>
      <button class="btn" id="dwSubmit">상신</button>
    </div>`);
  let lastTpl = null;
  const extra = () => {
    const t = $("#dwType").value;
    $("#dwLeave").classList.toggle("hidden", !t.includes("휴가"));
    // 기본 양식 자동 삽입 (직접 수정 전까지 종류 변경 시 갱신)
    const body = $("#dwBody");
    if (!body.value.trim() || body.value === lastTpl) { body.value = docTemplate(t); lastTpl = body.value; }
    $("#dwExtra").innerHTML = (t.includes("휴가") || t.includes("근무")) ? `
      <div class="row2">
        <div><label>시작일</label><input type="date" id="dwFrom" value="${CORE.dateStr(new Date())}"></div>
        <div><label>종료일</label><input type="date" id="dwTo" value="${CORE.dateStr(new Date())}"></div>
      </div>
      <label>구분</label>
      <select id="dwKind">${(t.includes("휴가") ? ["연차(종일)", "반차(0.5일)", "시간차(시간단위)", "병가", "경조사"] : ["초과근무", "휴일근무", "재택근무", "외근"]).map(k => `<option>${k}</option>`).join("")}</select>
      <div id="dwTimeWrap" class="hidden">
        <div class="row2">
          <div><label>시작 시각</label><input type="time" id="dwStime" value="${t.includes("휴가") ? "14:00" : esc(CFG.work.end)}"></div>
          <div><label>종료 시각</label><input type="time" id="dwEtime" value="${t.includes("휴가") ? "16:00" : "21:00"}"></div>
        </div>
        <div id="dwHours" style="font-size:12.5px;color:var(--navy);margin-top:4px"></div>
      </div>` : "";
    const kindSel = $("#dwKind");
    if (kindSel) {
      const syncTime = () => {
        const k = kindSel.value;
        const needTime = k.includes("시간차") || !t.includes("휴가") && (k === "초과근무" || k === "휴일근무");
        $("#dwTimeWrap").classList.toggle("hidden", !needTime);
        calcHours();
      };
      const calcHours = () => {
        const st = $("#dwStime"), et = $("#dwEtime");
        if (!st || $("#dwTimeWrap").classList.contains("hidden")) return;
        const h = (CORE.toMin(et.value) - CORE.toMin(st.value)) / 60;
        $("#dwHours").textContent = h > 0 ? `신청 시간: ${h}시간${t.includes("휴가") ? ` (연차 ${Math.round(h / 8 * 100) / 100}일 차감)` : ""}` : "종료 시각을 확인하세요";
      };
      kindSel.onchange = syncTime;
      $("#dwStime").addEventListener("input", calcHours);
      $("#dwEtime").addEventListener("input", calcHours);
      syncTime();
    }
  };
  extra();
  $("#dwType").onchange = extra;
  const drawLine = () => {
    $("#dwLine").innerHTML = line.map((u, i) => `<span class="chip">${i + 1}. ${esc(u.name)} ${esc(u.position)}<button data-i="${i}" aria-label="제거">✕</button></span>`).join("") || `<span style="font-size:12.5px;color:var(--sub)">결재자를 1명 이상 선택하세요</span>`;
    $("#dwLine").querySelectorAll("button").forEach(b => b.onclick = () => { line.splice(Number(b.dataset.i), 1); drawLine(); });
  };
  drawLine();
  $("#dwPick").onchange = e => {
    const u = USERS.find(x => x.id === e.target.value);
    if (u && !line.some(l => l.id === u.id)) { line.push(u); drawLine(); }
    e.target.value = "";
  };
  const savedSel = $("#dwSaved");
  if (savedSel) savedSel.onchange = e => {
    const l = savedLines[Number(e.target.value)];
    if (!l) return;
    line = l.userIds.map(id => USERS.find(u => u.id === id)).filter(Boolean);
    drawLine(); e.target.value = "";
    toast(`결재선 "${l.name}" 적용`);
  };
  $("#dwSaveLine").onclick = async () => {
    if (!line.length) return toast("저장할 결재선이 없습니다");
    const name = line.map(u => u.name).join("→");
    const next = savedLines.filter(l => l.name !== name).concat([{ name, userIds: line.map(u => u.id) }]).slice(-5);
    await DB.put("settings", { key: `lines_${ME.id}`, value: next });
    toast(`결재선 "${name}" 저장 (다음 기안부터 표시)`);
  };
  $("#dwCancel").onclick = closeModal;
  $("#dwSubmit").onclick = async () => {
    const type = $("#dwType").value, title = $("#dwTitle").value.trim(), body = $("#dwBody").value.trim();
    if (!title) return toast("제목을 입력하세요");
    if (!line.length) return toast("결재자를 선택하세요");
    const meta = {};
    if ($("#dwFrom")) {
      meta.from = $("#dwFrom").value; meta.to = $("#dwTo").value; meta.kind = $("#dwKind").value;
      if ($("#dwTimeWrap") && !$("#dwTimeWrap").classList.contains("hidden")) {
        meta.stime = $("#dwStime").value; meta.etime = $("#dwEtime").value;
        meta.hours = Math.round((CORE.toMin(meta.etime) - CORE.toMin(meta.stime)) / 60 * 100) / 100;
        if (!(meta.hours > 0)) return toast("종료 시각이 시작보다 빨라요");
        if (type.includes("휴가") && meta.hours > 8) return toast("시간차는 하루 8시간 이내로 신청하세요");
      }
      // 연차 잔여 검증 (휴가 계열: 연차/반차/시간차만 차감 대상)
      if (type.includes("휴가")) {
        const lv = await SVC.leaveStatus(ME.id);
        const req = leaveDaysOf(meta);
        if (req > 0 && req > lv.remain) return toast(`잔여 연차(${lv.remain}일)를 초과합니다. 관리자에게 문의하세요.`);
      }
    }
    const r = await SVC.submitDoc({ drafter: ME, type, title, body, meta, lineUsers: line });
    if (!r.ok) return toast(r.msg);
    closeModal(); toast("상신했습니다"); apprTab = "mine"; await renderApprList(); await refreshBadge();
  };
}

async function openDocDetail(docId) {
  const d = await DB.get("docs", docId);
  if (!d) return toast("문서를 찾을 수 없습니다");
  const metaHtml = d.meta && d.meta.from ? `<span>기간</span><b>${esc(d.meta.from)} ~ ${esc(d.meta.to)} (${esc(d.meta.kind)})${d.meta.stime ? ` · ${esc(d.meta.stime)}~${esc(d.meta.etime)} ${d.meta.hours}h` : ""}</b>` : "";
  const canAct = CORE.myTurn(d, ME.id);
  openModal(`
    <div class="doc-sheet" style="border:none;box-shadow:none;padding:4px 0">
      <div class="doc-title">[${esc(d.type)}] ${esc(d.title)}</div>
      <div class="doc-meta">
        ${d.docNo ? `<span>문서번호</span><b>${esc(d.docNo)}</b>` : ""}
        <span>기안자</span><b>${esc(d.drafterName)} ${esc(d.drafterPos || "")} · ${esc(d.drafterDept || "")}</b>
        <span>기안일</span><b>${fmtDate(d.createdAt)}</b>
        ${metaHtml}
        <span>상태</span><b>${statusPill(d.status)}</b>
      </div>
      <div class="doc-body">${esc(d.body) || "(내용 없음)"}</div>
      <div class="appr-line">
        <div class="appr-box"><div class="role">기안</div><div class="sign"><div class="stamp-mark">${esc(d.drafterName.slice(0, 3))}</div></div><div class="nm">${esc(d.drafterName)}</div></div>
        ${d.line.map(s => `
          <div class="appr-box"><div class="role">${esc(s.position)}</div>
            <div class="sign">${s.status === "승인" ? `<div class="stamp-mark">${esc(s.name.slice(0, 3))}</div>`
              : s.status === "반려" ? `<div class="stamp-mark reject">반려</div>`
              : `<span class="appr-wait">대기</span>`}</div>
            <div class="nm">${esc(s.name)}</div></div>`).join("")}
      </div>
      ${d.line.some(s => s.comment) ? `<div class="comment-log"><b>결재 의견</b>${d.line.filter(s => s.comment).map(s => `<div class="c"><b>${esc(s.name)}</b> · ${esc(s.comment)}</div>`).join("")}</div>` : ""}
      ${canAct ? `
        <label>결재 의견 (선택)</label><input id="ddComment" placeholder="의견 입력">
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn danger" id="ddReject">반려</button>
          <button class="btn" id="ddApprove">승인</button>
        </div>` : `
        ${d.drafterId === ME.id && d.status === "진행" && d.line.every(x => x.status === "대기") ? `<button class="btn ghost" id="ddRecall" style="margin-top:14px;color:var(--stamp)">상신 회수</button>` : ""}
        <button class="btn ghost" id="ddClose" style="margin-top:10px">닫기</button>`}
    </div>`);
  if (canAct) {
    $("#ddApprove").onclick = () => actDoc(d, "approve");
    $("#ddReject").onclick = () => actDoc(d, "reject");
  } else {
    $("#ddClose").onclick = closeModal;
    const rc = $("#ddRecall");
    if (rc) rc.onclick = async () => {
      const r = await SVC.recallDoc(d.docId, ME);
      if (!r.ok) return toast(r.msg);
      closeModal(); toast("회수했습니다"); await renderApprList(); await refreshBadge();
    };
  }
}
async function actDoc(d, action) {
  const r = await SVC.actOnDoc(d.docId, ME, action, $("#ddComment").value.trim());
  if (!r.ok) return toast(r.msg);
  closeModal();
  toast(action === "approve" ? "승인 처리했습니다" : "반려 처리했습니다");
  await renderApprList(); await refreshBadge();
}
</script>

<!-- ══════════ 게시판 · 근태 · 급여 · 관리자 ══════════ -->
<script id="appLogic2">
"use strict";
/* ── 근무 스케줄 (공연 일정 + 근무신청 공유 달력) ── */
let schCursor = null;   // Date (해당 월 1일)
async function renderSchedule() {
  if (!schCursor) { const n = new Date(); schCursor = new Date(n.getFullYear(), n.getMonth(), 1); }
  const y = schCursor.getFullYear(), m = schCursor.getMonth();
  const ym = `${y}-${CORE.pad2(m + 1)}`;
  const rows = (await DB.all("schedule")).filter(x => x.date && x.date.startsWith(ym));
  const byDate = {};
  for (const r of rows) (byDate[r.date] ||= []).push(r);
  const first = new Date(y, m, 1), startDow = first.getDay(), dim = new Date(y, m + 1, 0).getDate();
  const today = CORE.dateStr(new Date());
  const myShifts = rows.filter(r => r.kind === "shift" && r.userId === ME.id);
  const myFix = myShifts.filter(r => r.status === "확정").length;

  let cells = "";
  for (let i = 0; i < startDow; i++) cells += `<div class="day dim"></div>`;
  for (let d = 1; d <= dim; d++) {
    const ds = `${ym}-${CORE.pad2(d)}`;
    const dow = (startDow + d - 1) % 7;
    const list = (byDate[ds] || []);
    const evs = list.filter(r => r.kind === "event");
    const shs = list.filter(r => r.kind === "shift").sort((a, b) => a.startTime.localeCompare(b.startTime));
    cells += `<button class="day ${dow === 0 ? "sun" : dow === 6 ? "sat" : ""} ${ds === today ? "today" : ""}" data-day="${ds}">
      <span class="dn">${d}</span>
      ${evs.slice(0, 2).map(e => `<span class="ev">🎭 ${esc(e.title)}${e.perfTime ? " " + esc(e.perfTime) : ""}</span>`).join("")}
      ${shs.slice(0, 3).map(sh => `<span class="sh ${sh.status === "확정" ? "fix" : ""} ${sh.userId === ME.id ? "mine" : ""}">${esc(sh.userName)} ${sh.startTime}</span>`).join("")}
      ${evs.length + shs.length > 5 ? `<span style="font-size:9px;color:var(--sub)">+${evs.length + shs.length - 5}</span>` : ""}
    </button>`;
  }
  $("#view-schedule").innerHTML = `
    <div class="cal-head">
      <span class="ym">${y}. ${CORE.pad2(m + 1)}</span>
      <div class="cal-nav">
        ${ME.role === "admin" ? `<button id="schBulk">📤 엑셀 일괄</button>` : ""}
        <button id="schPrev">‹</button><button id="schToday">오늘</button><button id="schNext">›</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="k">이달 내 근무 (확정/신청)</div><div class="v">${myFix}<small> / ${myShifts.length}건</small></div></div>
      <div class="stat"><div class="k">이달 공연/특이사항</div><div class="v">${rows.filter(r => r.kind === "event").length}<small>건</small></div></div>
      <div class="stat"><div class="k">전체 근무 신청</div><div class="v">${rows.filter(r => r.kind === "shift").length}<small>건</small></div></div>
    </div>
    <div class="cal">
      ${["일", "월", "화", "수", "목", "금", "토"].map((n, i) => `<div class="dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${n}</div>`).join("")}
      ${cells}

async function ensureXLSX() {
  if (window.XLSX) return true;
  try {
    await new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      sc.onload = res; sc.onerror = rej;
      document.head.appendChild(sc);
    });
    return !!window.XLSX;
  } catch (e) { return false; }
}
/* 명세서 → 엑셀 시트 데이터 (1인 양식) */
function buildSlipAoa(p, u) {
  const rows = [
    [`${p.ym} ${p.empType === "daily" ? "일용직 " : ""}급여명세서`],
    [],
    ["사번", p.userId, "성명", p.userName],
    ["고용형태", p.empType === "daily" ? "일용직" : "정규직", "지급계좌", u ? `${u.bank || ""} ${u.account || ""}`.trim() : ""],
    ["산정기준", p.basis === "schedule" ? "확정 근무스케줄" : "출퇴근 기록", "4대보험", p.insured ? `적용(월 ${p.workDays}일 근무)` : (p.empType === "daily" ? "고용보험만" : "적용")],
    [],
  ];
  if (p.empType === "daily" && (p.details || []).length) {
    rows.push(["① 근무 내역"], ["날짜", "공연/구분", "시작", "종료", "인정시간"]);
    for (const dd of p.details) rows.push([dd.date, dd.label, dd.s, dd.e, CORE.minToHM(dd.min)]);
    rows.push([]);
  }
  rows.push(["② 급여 산출 내역"], ["항목", "금액(원)"]);
  const pay = [["일당/기본급 합계", p.base]];
  if (p.allowance) pay.push(["제수당", p.allowance]);
  if (p.overtime) pay.push(["연장근로수당", p.overtime]);
  if (p.nightPay) pay.push(["야간근로수당", p.nightPay]);
  if (p.holidayPay) pay.push(["휴일근로수당", p.holidayPay]);
  if (p.juhyuPay) pay.push(["주휴수당", p.juhyuPay]);
  if (p.itemAllow) pay.push(["기타수당", p.itemAllow]);
  pay.push(["지급 합계", p.gross]);
  if (p.pension) pay.push(["국민연금", -p.pension]);
  if (p.health) pay.push(["건강보험", -p.health]);
  if (p.care) pay.push(["장기요양", -p.care]);
  pay.push(["고용보험", -p.employ], ["소득세", -p.incomeTax], ["지방소득세", -p.localTax]);
  if (p.itemDeduct) pay.push(["기타공제", -p.itemDeduct]);
  pay.push(["공제 합계", -p.totalDeduct], ["실수령액", p.net]);
  rows.push(...pay, []);
  rows.push(["③ 확인"],
    ["근무내역 확인", p.workConfirmedAt ? `서명 완료 · ${p.workConfirmedAt.slice(0, 16).replace("T", " ")}` : "미확인"],

  return rows;
}
globalThis.buildSlipAoa = buildSlipAoa;
/* 간단 CSV 파서 (따옴표 필드 지원) */
function parseCsv(text) {
  const out = []; let row = [], cur = "", q = false;
  text = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); out.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); out.push(row); }
  return out.filter(r => r.some(c => String(c).trim() !== ""));
}
globalThis.parseCsv = parseCsv;
const EV_HEADERS = ["날짜", "공연명", "장소", "공연시간", "객석오픈", "근무시작", "근무종료", "특이사항"];
function rowsToEvents(aoa) {
  const body = aoa[0] && String(aoa[0][0]).includes("날짜") ? aoa.slice(1) : aoa;
  return body.map(r => ({ date: String(r[0] || "").trim(), title: String(r[1] || "").trim(), venue: String(r[2] || "").trim(),
    perfTime: String(r[3] || "").trim(), houseOpen: String(r[4] || "").trim(), workStart: String(r[5] || "").trim(),
    workEnd: String(r[6] || "").trim(), note: String(r[7] || "").trim() }));
}
globalThis.rowsToEvents = rowsToEvents;

    </div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">

          <div class="grow"><div class="t">${esc(p.title)} ${p.comments.length ? `<span style="color:var(--navy);font-size:12.5px">[${p.comments.length}]</span>` : ""}</div>
          <div class="s">${esc(p.authorName)} · ${fmtDate(p.createdAt)} · 조회 ${p.views}</div></div>

function openPostWrite() {

    <select id="pwBoard">${CFG.boards.filter(b => canWrite(b)).map(b => `<option value="${esc(b.key)}" ${boardTab === b.key ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select>

async function openPostDetail(postId) {

  p.views++; await DB.put("posts", p);

/* ── 근태 ── */
let clockTimer = null;
async function renderAttend() {
  const today = CORE.dateStr(new Date());
  const atts = (await DB.all("attendance")).filter(a => a.userId === ME.id);
  const myToday = atts.find(a => a.date === today);
  const ym = CORE.monthStr(new Date());
  const monthAtts = atts.filter(a => a.date.startsWith(ym)).sort((a, b) => b.date.localeCompare(a.date));
  const totalMin = monthAtts.reduce((s, a) => s + (a.workMin || 0), 0);
  const lateN = monthAtts.filter(a => a.status.startsWith("지각")).length;
  // 이번 주(월~일) 집계: 기본/초과/인정근무
  const now = new Date();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const wkFrom = CORE.dateStr(monday);
  const std = SVC.stdDayMin();
  const wkAtts = atts.filter(a => a.date >= wkFrom && a.date <= today && a.outTime);
  const wkTotal = wkAtts.reduce((s, a) => s + (a.workMin || 0), 0);
  const wkOt = wkAtts.reduce((s, a) => s + Math.max(0, (a.workMin || 0) - std), 0);
  const wkBase = wkTotal - wkOt;
  const leave = await SVC.leaveStatus(ME.id);

  $("#view-attend").innerHTML = `
    <div class="card clock-card">
      <div class="clock-time" id="liveClock">--:--:--</div>
      <div class="clock-date">${today} · 기준 근무시간 ${esc(CFG.work.start)} ~ ${esc(CFG.work.end)} (휴게 ${CFG.work.breakMin}분)</div>
      <div class="clock-btns">
        <button class="btn" id="btnIn" ${myToday ? "disabled" : ""}>출근</button>
        <button class="btn ghost" id="btnOut" ${myToday && !myToday.outTime ? "" : "disabled"}>퇴근</button>
      </div>
      <div class="clock-state">${!myToday ? "아직 출근 전입니다" : myToday.outTime ? `${myToday.inTime} 출근 → ${myToday.outTime} 퇴근 · ${esc(myToday.status)}` : `${myToday.inTime} 출근 · 근무중`}</div>
    </div>
    <div class="card">
      <div class="card-head"><h3>이번 주 근무 집계</h3><span style="font-size:12px;color:var(--sub)">${wkFrom.slice(5)} ~ 오늘</span></div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px">
        <div>기본근무 <b>${CORE.minToHM(wkBase)}</b></div>
        <div style="color:var(--stamp)">초과근무 <b>${CORE.minToHM(wkOt)}</b></div>
        <div style="color:var(--navy)">인정근무 <b>${CORE.minToHM(wkTotal)}</b></div>
      </div>
      <div style="height:8px;background:var(--paper);border-radius:99px;overflow:hidden;margin-top:10px;display:flex">
        <div style="width:${Math.min(100, wkBase / (40 * 60) * 100)}%;background:var(--navy)"></div>
        <div style="width:${Math.min(100, wkOt / (40 * 60) * 100)}%;background:var(--stamp)"></div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="k">${ym} 근무일</div><div class="v">${monthAtts.length}<small>일</small></div></div>
      <div class="stat"><div class="k">누적 근무시간</div><div class="v" style="font-size:17px;padding-top:4px">${CORE.minToHM(totalMin)}</div></div>
      <div class="stat"><div class="k">지각</div><div class="v">${lateN}<small>회</small></div></div>
      ${ME.empType !== "daily" ? `<div class="stat"><div class="k">연차 잔여</div><div class="v">${leave.remain}<small>/ ${leave.granted}일</small></div></div>` : ""}
    </div>
    <div class="card">
      <div class="card-head"><h3>이달 근태 기록</h3><button class="more" id="btnReqWork">근무/휴가 신청 ›</button></div>
      <div class="table-wrap"><table class="grid">
        <tr><th>날짜</th><th>출근</th><th>퇴근</th><th>근무</th><th>상태</th></tr>
        ${monthAtts.length ? monthAtts.map(a => `<tr><td>${a.date.slice(5)}</td><td>${a.inTime || "-"}</td><td>${a.outTime || "-"}</td><td>${a.workMin ? CORE.minToHM(a.workMin) : "-"}</td><td>${esc(a.status)}</td></tr>`).join("") : `<tr><td colspan="5" style="color:var(--sub)">기록 없음</td></tr>`}
      </table></div>
    </div>`;
  const tick = () => { const el = $("#liveClock"); if (el) el.textContent = new Date().toTimeString().slice(0, 8); };
  clearInterval(clockTimer); clockTimer = setInterval(tick, 1000); tick();
  $("#btnIn").onclick = async () => {
    const r = await SVC.clockIn(ME);
    toast(r.ok ? `출근 완료 (${r.inTime})` : r.msg); renderAttend();
  };
  $("#btnOut").onclick = async () => {
    const r = await SVC.clockOut(ME);
    toast(r.ok ? `퇴근 완료 (${r.outTime})` : r.msg); renderAttend();
  };
  $("#btnReqWork").onclick = () => go("approval", "req");
}

/* ── 급여 ── */
let payMasked = true;
const PF = n => payMasked ? "•••,•••" : F(n);
async function renderPay() {
  const slips = (await DB.all("payroll")).filter(p => p.userId === ME.id).sort((a, b) => b.ym.localeCompare(a.ym));
  $("#view-pay").innerHTML = `
    <div class="toolbar">
      <button class="btn small ghost" id="btnPayMask">${payMasked ? "🔓 금액 표시" : "🔒 금액 숨김"}</button>
      <button class="btn small ghost" id="btnMySign">✍️ ${ME.signature ? "서명 변경" : "서명 등록"}</button>
      ${ME.role === "admin" ? `<button class="btn small" id="btnGoPayAdmin">급여 등록 ›</button>` : "<span></span>"}
    </div>
    ${slips.length ? slips.map(p => (p.kind !== "bonus" && p.empType === "daily") ? dailySlipHtml(p) : paySlipHtml(p)).join("") : `<div class="card"><div class="empty">발급된 급여명세서가 없습니다.</div></div>`}
    ${CFG.payPolicy ? `<div class="card"><h3 style="font-size:14px">📌 급여 지침</h3><div style="white-space:pre-wrap;font-size:13px;color:var(--sub);margin-top:6px">${esc(CFG.payPolicy)}</div></div>` : ""}
    <div class="card" style="font-size:12px;color:var(--sub)">공제액은 설정된 요율과 간이세액표 근사치 기반의 참고용 계산입니다. 소득세 1,000원 미만은 소액부징수로 0원 처리됩니다.</div>`;
  const g = $("#btnGoPayAdmin"); if (g) g.onclick = () => go("admin");
  $("#btnPayMask").onclick = () => { payMasked = !payMasked; renderPay(); };
  $("#btnMySign").onclick = openSignForm;
  $("#view-pay").querySelectorAll("[data-confirm]").forEach(b => b.onclick = async () => {
    if (!ME.signature) { toast("먼저 서명을 등록하세요"); return openSignForm(); }
    const r = await SVC.confirmSlip(Number(b.dataset.pay), b.dataset.confirm, ME);
    if (!r.ok) return toast(r.msg);
    toast(b.dataset.confirm === "work" ? "근무내역을 확인했습니다 (서명 완료)" : "급여를 최종 확인했습니다 (서명 완료)");
    renderPay();
  });
}

/* 서명 렌더링: dataURL이면 이미지, 아니면 필기체풍 텍스트 */
const signHtml = sg => sg && sg.startsWith("data:image")
  ? `<img src="${sg}" alt="서명" style="height:40px">`
  : `<span style="font-family:cursive;font-size:20px;color:var(--navy)">${esc(sg || "")}</span>`;

/* 서명 등록 (캔버스 + 텍스트 대체) */
function openSignForm() {
  openModal(`
    <h3>✍️ 전자서명 등록</h3>
    <div style="font-size:12.5px;color:var(--sub);margin:4px 0 8px">일용직 급여명세서의 근무 확인·최종 확인에 사용됩니다.</div>
    <canvas id="sgCanvas" width="440" height="150" style="width:100%;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none"></canvas>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn small ghost" id="sgClear">지우기</button>
      <span style="flex:1"></span>
    </div>
    <label>손글씨가 어려우면 서명 텍스트 입력</label>
    <input id="sgText" placeholder="예: ${esc(ME.name)}" value="">
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn ghost" id="sgCancel">취소</button><button class="btn" id="sgSave">저장</button>
    </div>`);
  const cv = $("#sgCanvas");
  let drew = false;
  try {
    const ctx = cv.getContext("2d");
    ctx.lineWidth = 2.5; ctx.lineCap = "round"; ctx.strokeStyle = "#1E2430";
    let on = false;
    const pos = e => { const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e;
      return { x: (t.clientX - r.left) * (cv.width / r.width), y: (t.clientY - r.top) * (cv.height / r.height) }; };
    const down = e => { on = true; drew = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); };
    const move = e => { if (!on) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); };
    const up = () => on = false;
    cv.addEventListener("mousedown", down); cv.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    cv.addEventListener("touchstart", down, { passive: false }); cv.addEventListener("touchmove", move, { passive: false }); cv.addEventListener("touchend", up);
    $("#sgClear").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); drew = false; };
  } catch (e) { /* 캔버스 미지원 환경: 텍스트 서명만 사용 */ }
  $("#sgCancel").onclick = closeModal;
  $("#sgSave").onclick = async () => {
    let sign = $("#sgText").value.trim();
    if (drew) { try { sign = cv.toDataURL("image/png"); } catch (e) {} }
    if (!sign) return toast("서명을 그리거나 입력하세요");
    const r = await SVC.setSignature(ME, sign);
    if (!r.ok) return toast(r.msg);
    ME = await DB.get("users", ME.id);
    closeModal(); toast("서명을 저장했습니다"); renderPay();
  };
}

/* ── 일용직 전용 명세서: 근무내역 → 근무확인 서명 → 산출내역 → 최종확인 서명 ── */
function dailySlipHtml(p) {

  return `<div class="card" style="border-top:3px solid var(--navy)">

        ${p.finalConfirmedAt ? `<span class="pill ok" style="vertical-align:2px">확인 완료</span>` : p.workConfirmedAt ? `<span class="pill ing" style="vertical-align:2px">최종확인 대기</span>` : `<span class="pill wait" style="vertical-align:2px">근무확인 대기</span>`}</h3>
      <span class="pay-net">${PF(p.net)}원</span>
    </div>
    <div style="font-size:12.5px;color:var(--sub)">일당 ${PF(p.dailyWage)}원 × ${p.workDays}일 · ${p.basis === "schedule" ? "확정 스케줄 기준" : "출퇴근 기록 기준"}${p.insured ? " · 4대보험 적용(월 " + p.workDays + "일 근무)" : ""}</div>

    <label style="margin-top:14px">① 근무 내역 (신청·확정 기준)</label>
    <div class="table-wrap"><table class="grid">
      <tr><th>날짜</th><th>공연/구분</th><th>근무시간</th><th>인정</th></tr>
      ${dts.length ? dts.map(dd => `<tr><td>${dd.date.slice(5)}</td><td class="l">${esc(dd.label)}</td><td>${dd.s}~${dd.e}</td><td>${CORE.minToHM(dd.min)}</td></tr>`).join("") : `<tr><td colspan="4" style="color:var(--sub)">근무 내역 없음</td></tr>`}
    </table></div>
    <div style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:${p.workConfirmedAt ? "var(--ok-t)" : "#fff"}">
      ${p.workConfirmedAt
        ? `<div style="display:flex;align-items:center;gap:10px;font-size:13px"><b>근무내역 확인</b> ${signHtml(p.workSign)} <span style="color:var(--sub)">${fmtDate(p.workConfirmedAt)}</span></div>`
        : `<button class="btn small" data-confirm="work" data-pay="${p.payId}">✍️ 근무내역 확인 (서명)</button>
           <span style="font-size:12px;color:var(--sub);margin-left:8px">위 근무 내역이 맞으면 서명해 주세요</span>`}
    </div>

    <label style="margin-top:14px">② 급여 산출 내역</label>
    <table class="pay-table">
      <tr><td>일당 합계 (${p.workDays}일)</td><td>${PF(p.base)}</td></tr>
      ${p.overtime ? `<tr><td>연장근로수당 (${CORE.minToHM(p.otMin)})</td><td>${PF(p.overtime)}</td></tr>` : ""}
      ${p.nightPay ? `<tr><td>야간근로수당 (${CORE.minToHM(p.nightMin)})</td><td>${PF(p.nightPay)}</td></tr>` : ""}
      ${p.holidayPay ? `<tr><td>휴일근로수당 (${CORE.minToHM(p.holidayMin)})</td><td>${PF(p.holidayPay)}</td></tr>` : ""}
      ${p.juhyuPay ? `<tr><td>주휴수당</td><td>${PF(p.juhyuPay)}</td></tr>` : ""}
      ${p.itemAllow ? `<tr><td>기타수당</td><td>${PF(p.itemAllow)}</td></tr>` : ""}
      <tr class="sum"><td>지급 합계</td><td>${PF(p.gross)}</td></tr>
      ${p.pension ? `<tr class="deduct"><td>국민연금</td><td>-${PF(p.pension)}</td></tr>` : ""}
      ${p.health ? `<tr class="deduct"><td>건강보험</td><td>-${PF(p.health)}</td></tr>` : ""}
      ${p.care ? `<tr class="deduct"><td>장기요양보험</td><td>-${PF(p.care)}</td></tr>` : ""}
      <tr class="deduct"><td>고용보험</td><td>-${PF(p.employ)}</td></tr>
      <tr class="deduct"><td>일용근로소득세</td><td>-${PF(p.incomeTax)}</td></tr>
      <tr class="deduct"><td>지방소득세</td><td>-${PF(p.localTax)}</td></tr>
      ${p.itemDeduct ? `<tr class="deduct"><td>기타공제</td><td>-${PF(p.itemDeduct)}</td></tr>` : ""}
      <tr class="sum"><td>공제 합계</td><td style="color:var(--stamp)">-${PF(p.totalDeduct)}</td></tr>
      <tr class="sum"><td>실수령액</td><td style="color:var(--navy)">${PF(p.net)}원</td></tr>
    </table>
    <div style="margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:${p.finalConfirmedAt ? "var(--ok-t)" : "#fff"}">
      ${p.finalConfirmedAt
        ? `<div style="display:flex;align-items:center;gap:10px;font-size:13px"><b>최종 확인</b> ${signHtml(p.finalSign)} <span style="color:var(--sub)">${fmtDate(p.finalConfirmedAt)}</span></div>`
        : p.workConfirmedAt
          ? `<button class="btn small" data-confirm="final" data-pay="${p.payId}">✍️ 급여 최종 확인 (서명)</button>

          : `<span style="font-size:12.5px;color:var(--sub)">근무내역 확인 후 최종 확인이 가능합니다</span>`}
    </div>
  </div>`;
}
function paySlipHtml(p) {
  const isBonus = p.kind === "bonus";
  return `<div class="card">
    <div class="card-head">
      <h3>${p.ym} ${isBonus ? esc(p.label || "성과급") + " 명세서" : "급여명세서"}
        ${p.issued ? `<span class="pill ok" style="vertical-align:2px">발급</span>` : ""}</h3>

          <div><label>기본급(월) *</label><input id="apvWage" inputmode="numeric" value="2500000"></div>
          <div><label>연차 부여일수</label><input id="apvLeave" inputmode="numeric" value="15"></div>

    </div>`);

  $("#apvNo").onclick = async () => {
    const r = await SVC.approveUser(tempId, false, ME);
    r.ok ? (closeModal(), toast("거절 처리했습니다"), renderAdminEmp()) : toast(r.msg);
  };
  $("#apvOk").onclick = async () => {
    const opts = { newId: $("#apvId").value.trim() };
    if (isDaily) opts.dailyWage = Number($("#apvWage").value) || 0;

    if (!r.ok) return toast(r.msg);
    closeModal(); toast(`승인 완료 — 사번 ${r.newId} 발급`); renderAdminEmp();
  };
}

    closeModal(); toast("저장했습니다"); renderAdminEmp();
  };
}

    const ymv = $("#bnYm").value; if (!ymv) return toast("연월을 선택하세요");
    const mode = $("#bnMode").value;
    const entries = USERS.map(u => ({ userId: u.id, amount: mode === "fix" ? (Number($("#bnFix").value) || 0) : Math.round(u.salaryBase * Number(mode)) }));
    const rs = await SVC.grantBonus(ymv, entries, { actor: ME });
    const done = rs.filter(r => !r.skipped);
    $("#bnResult").innerHTML = `<div style="font-size:13px"><b>${done.length}건 지급</b>${rs.length - done.length ? ` · ${rs.length - done.length}건 기지급 건너뜀` : ""}<br>${done.map(r => `${esc(r.name)}: 실수령 ${F(r.net)}원`).join("<br>")}</div>`;
    toast(`성과급 ${done.length}건 지급 완료`);
  };
  const preview = () => {
    const u = USERS.find(x => x.id === $("#apUser").value);
    if (!u) return;
    const r = CORE.calcPayroll({ base: u.salaryBase, allowance: Number($("#apAllow").value) || 0, overtime: Number($("#apOt").value) || 0 });
    $("#apPreview").innerHTML = `지급계 <b>${F(r.gross)}</b> · 공제계 <b style="color:var(--stamp)">${F(r.totalDeduct)}</b> · 실수령 <b style="color:var(--navy)">${F(r.net)}원</b>`;
  };
  ["apUser", "apAllow", "apOt"].forEach(id => $("#" + id).addEventListener("input", preview));
  preview();
  $("#apSave").onclick = async () => {
    const u = USERS.find(x => x.id === $("#apUser").value);
    const ymv = $("#apYm").value;
    if (!u || !ymv) return toast("대상과 연월을 확인하세요");
    const dup = (await DB.all("payroll")).find(p => p.userId === u.id && p.ym === ymv && (p.kind || "salary") === "salary");
    if (dup) return toast(`${ymv} ${u.name} 급여가 이미 등록되어 있습니다`);
    const allowance = Number($("#apAllow").value) || 0, overtime = Number($("#apOt").value) || 0;
    const r = CORE.calcPayroll({ base: u.salaryBase, allowance, overtime });
    await DB.add("payroll", { kind: "salary", userId: u.id, userName: u.name, ym: ymv, base: u.salaryBase, allowance, overtime, ...r, issued: true, issuedAt: new Date().toISOString(), createdAt: new Date().toISOString() });
    toast(`${u.name} ${ymv} 급여 등록 완료`); renderAdminPay();
  };
}

  };
}

    try {
      const blob = new Blob([JSON.stringify(dump, null, 1)], { type: "application/json" });

        if (!Array.isArray(dump[st])) continue;
        for (const row of await DB.all(st)) {
          const keyName = { users: "id", docs: "docId", posts: "postId", payroll: "payId", attendance: "attId", auditlog: "logId", settings: "key" }[st];

      await loadCFG();
      SVC.log(ME, "백업가져오기", file.name);
      toast("복원했습니다"); renderAdminCfg();

  });

      <div style="margin-top:8px;font-size:14px">모든 데이터가 삭제되고 샘플 데이터로 재시작합니다. 되돌릴 수 없습니다.</div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn ghost" id="rsCancel">취소</button><button class="btn danger" id="rsOk">초기화</button>
      </div>`);
    $("#rsCancel").onclick = closeModal;
    $("#rsOk").onclick = () => { indexedDB.deleteDatabase("groupwareDB"); sessionStorage.clear(); location.reload(); };
  };
}

        ${atts.length ? atts.map(a => `<tr><td>${a.date.slice(5)}</td><td>${esc(a.userName)}</td><td>${a.inTime || "-"}</td><td>${a.outTime || "-"}</td><td>${esc(a.status)}</td>

      </table></div>
      <div style="font-size:12px;color:var(--sub);margin-top:8px">수정·삭제는 전건 활동 로그에 기록되며, 상태는 설정된 근무시간 기준으로 자동 재판정됩니다.</div>
    </div>`;

    <label>날짜</label><input type="date" id="afDate" value="${a ? a.date : CORE.dateStr(new Date())}" ${a ? "disabled" : ""}>
    <div class="row2">
      <div><label>출근 시각</label><input type="time" id="afIn" value="${a ? a.inTime : "09:00"}"></div>
      <div><label>퇴근 시각</label><input type="time" id="afOut" value="${a && a.outTime ? a.outTime : ""}"></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn ghost" id="afCancel">취소</button><button class="btn" id="afSave">저장</button>
    </div>`);
  $("#afCancel").onclick = closeModal;
  $("#afSave").onclick = async () => {
    const r = await SVC.upsertAttendance({
      attId: a ? a.attId : null, userId: $("#afUser").value, date: $("#afDate").value,
      inTime: $("#afIn").value, outTime: $("#afOut").value || null,
    }, ME);
    if (!r.ok) return toast(r.msg);
    closeModal(); toast(`저장했습니다 (${r.status})`); renderAdminAtt();
  };
}

/* ── 초기화 ── */
function openServerCfg() {
  openModal(`
    <h3>⚙️ 서버 연결 설정</h3>
    <div style="font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.6">
      Google Apps Script 백엔드에 연결하면 60명이 같은 데이터를 공유합니다.<br>
      비워두고 저장하면 이 기기 전용(로컬) 모드로 동작합니다.
    </div>
    <label>웹 앱 URL</label><input id="svUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(localStorage.getItem("gw_api_url") || "")}">
    <label>API 키</label><input id="svKey" placeholder="setup() 실행 로그의 API_KEY" value="${esc(localStorage.getItem("gw_api_key") || "")}">
    <div id="svMsg" style="font-size:13px;margin-top:10px"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn ghost" id="svCancel">취소</button>
      <button class="btn ghost" id="svTest">연결 테스트</button>
      <button class="btn" id="svSave">저장 후 재시작</button>
    </div>`);
  $("#svCancel").onclick = closeModal;
  $("#svTest").onclick = async () => {
    const url = $("#svUrl").value.trim(), key = $("#svKey").value.trim();
    if (!url) { $("#svMsg").innerHTML = `<span style="color:var(--sub)">URL이 비어 있습니다 (로컬 모드)</span>`; return; }
    $("#svMsg").textContent = "연결 확인 중…";
    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ key, action: "ping" }) });
      const j = await res.json();
      $("#svMsg").innerHTML = j.ok ? `<b style="color:var(--ok)">✓ 연결 성공</b>` : `<b style="color:var(--stamp)">✗ ${esc(j.msg || "실패")}</b>`;
    } catch (e) { $("#svMsg").innerHTML = `<b style="color:var(--stamp)">✗ 연결 실패 — URL/배포 상태 확인</b>`; }
  };
  $("#svSave").onclick = () => {
    const url = $("#svUrl").value.trim(), key = $("#svKey").value.trim();
    if (url) { localStorage.setItem("gw_api_url", url); localStorage.setItem("gw_api_key", key); }
    else { localStorage.removeItem("gw_api_url"); localStorage.removeItem("gw_api_key"); }
    location.reload();
  };
}

async function init() {
  const remote = RemoteDB.isConfigured();
  if (remote) {
    try { await DB.open(); }
    catch (e) {
      alert("서버 연결 실패: " + e.message + "\n로컬 모드로 전환합니다.");
      DB = LocalDB; globalThis.DB = DB;
      await DB.open();
    }
  } else await DB.open();
  const seeded = await seedIfEmpty();
  await loadCFG();
  const hint = $("#loginHint");
  if (DB === RemoteDB) hint.innerHTML = `🌐 <b>서버 공용 모드</b>로 동작 중 — 전 직원이 같은 데이터를 공유합니다.`;
  $("#btnSrvCfg").onclick = openServerCfg;
  $("#btnLogin").onclick = doLogin;
  $("#btnSignup").onclick = openSignup;
  $("#loginPw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  $("#btnLogout").onclick = doLogout;
  $("#btnLogout2").onclick = doLogout;
  $("#btnBell").onclick = openNotify;
  $$(".nav-item[data-view],.tab[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
  // 세션 복원
  const uid = sessionStorage.getItem("gw_uid");
  if (uid) { const u = await DB.get("users", uid); if (u) { ME = u; await enterApp(); } }
  if (seeded) console.log("[groupware] 샘플 데이터 생성 완료");
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
